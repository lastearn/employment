name: Deploy wishlist
on:
  push:
    branches: [main]
    paths: ["wishlist/**", ".github/workflows/deploy-wishlist.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wishlist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Pick / create hosting site
        run: |
          npm i -g firebase-tools@13 >/dev/null 2>&1
          P=employment-trainer
          SITE=""
          for s in lastearn-wishlist lastearn-wish stepa-wishlist lastearn-wishes; do
            if firebase hosting:sites:get "$s" --project $P >/dev/null 2>&1; then SITE=$s; break; fi
            if firebase hosting:sites:create "$s" --project $P --non-interactive; then SITE=$s; break; fi
          done
          [ -n "$SITE" ] || { echo "no site"; exit 1; }
          echo "SITE=$SITE" >> "$GITHUB_ENV"
          printf '{"hosting":{"site":"%s","public":"public","headers":[{"source":"**/*.json","headers":[{"key":"Cache-Control","value":"no-cache"}]}]}}' "$SITE" > firebase.json
          cat firebase.json
      - name: Deploy
        run: |
          firebase deploy --only hosting --project employment-trainer --non-interactive
          echo "### Вишлист: https://$SITE.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "WISHLIST_URL=https://$SITE.web.app"
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
