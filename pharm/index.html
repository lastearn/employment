<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фармакология — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#15201c; --muted:#5f6f68; --line:#dde5e1;
  --acc:#0f8a6c; --acc2:#e6f4ef; --bad:#d64545; --bad2:#fdecec; --good:#1f9d55; --good2:#e3f6ea;
  --warn:#b7791f; --warn2:#fdf3e1; --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1513; --card:#18211e; --ink:#e7efeb; --muted:#93a59d; --line:#2a3632;
    --acc:#35c49b; --acc2:#16302a; --bad:#ff7b7b; --bad2:#3a1d1d; --good:#4fd18b; --good2:#183324;
    --warn:#f2b45a; --warn2:#3a2d17; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
.back{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.topic{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.topic .ic{font-size:28px;width:46px;height:46px;display:grid;place-items:center;background:var(--acc2);border-radius:12px;flex:none}
.topic b{display:block;font-size:16px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:96px}
.mode .e{font-size:24px}
.mode b{display:block;margin-top:4px}
.mode small{color:var(--muted);display:block;font-size:12.5px}
.mode .best{color:var(--acc);font-weight:700;font-size:12.5px}
.btn{border:none;background:var(--acc);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* summary */
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.sec summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary:after{content:"＋";color:var(--muted)}
details.sec[open] summary:after{content:"－"}
details.sec .in{padding:0 16px 14px}
details.sec ul{margin:0;padding-left:20px}
details.sec li{margin:4px 0}
.memo{background:var(--warn2);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.memo:before{content:"💡 Запомни: ";font-weight:800}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:6px;padding:1px 6px;font-weight:700;font-size:.92em}
/* flashcards */
.flip{perspective:1000px;height:260px;margin-bottom:12px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;overflow:auto}
.flip .back-f{transform:rotateY(180deg);background:var(--acc2)}
.flip .face .q{font-size:19px;font-weight:700}
.flip .face .a{font-size:16px}
.flip .hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
/* quiz */
.q-title{font-size:18px;font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:500}
.opt.ok{border-color:var(--good);background:var(--good2)}
.opt.no{border-color:var(--bad);background:var(--bad2)}
.opt:disabled{cursor:default}
.expl{background:var(--acc2);border-radius:12px;padding:10px 12px;font-size:14.5px;margin:6px 0 12px}
.progress-line{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;margin-bottom:6px}
.result{text-align:center;padding:26px 16px}
.result .big{font-size:54px;font-weight:800;color:var(--acc)}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:58px;font-size:14px;text-align:center;font-weight:600}
.pc.sel{border-color:var(--acc);background:var(--acc2)}
.pc.done{opacity:.35;border-color:var(--good);cursor:default}
.pc.err{border-color:var(--bad);background:var(--bad2);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* sort */
.drug{font-size:24px;font-weight:800;text-align:center;padding:22px 10px;background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px}
.gbtn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:7px;font-weight:600;font-size:14.5px}
.gbtn.ok{border-color:var(--good);background:var(--good2)}
.gbtn.no{border-color:var(--bad);background:var(--bad2)}
.streak{font-weight:800;color:var(--warn)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .btn{padding:16px}
.tf .btn.f{background:var(--bad)}
.note{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
.hero{background:linear-gradient(135deg,var(--acc),#0b6b8a);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:22px}
.hero p{margin:0;opacity:.9;font-size:14px}
.hero .btn{background:#fff;color:#0b5e4b;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================== ДАННЫЕ ===================== */
const TOPICS = [
{
 id:"ad", icon:"🧠", title:"Антидепрессанты и анксиолитики",
 summary:[
  {h:"Депрессия и откуда она берётся", p:[
   "<b>Антидепрессанты</b> — ЛС для лечения депрессий.",
   "<b>Депрессия</b> — патологически пониженное настроение (<b>гипотимия</b>), пессимизм, торможение мышления и движений, снижение побуждений, соматовегетативные нарушения.",
   "<b>Биохимическая теория:</b> в мозге мало моноаминов — <b>норадреналина и серотонина</b> → растёт число и чувствительность рецепторов (<b>up-регуляция</b>)."],
   memo:"Депрессия = не хватает серотонина и норадреналина. Почти все антидепрессанты так или иначе увеличивают их в синапсе."},
  {h:"Тимеретики vs тимолептики", p:[
   "<b>Тимеретики</b> — со <b>стимулирующим</b> компонентом, для депрессии со стойким угнетением: флуоксетин, венлафаксин, милнаципран, имипрамин.",
   "<b>Тимолептики</b> — с <b>седативным</b> компонентом, для депрессии с возбуждением (ажитацией): эсциталопрам, сертралин, миртазапин, амитриптилин.",
   "<b>Сбалансированные:</b> мапротилин, сертралин, венлафаксин."],
   memo:"ТимЕРЕТик — «ЭРЕКТор», поднимает и бодрит. ТимоЛЕПТик — «уЛЁГся», успокаивает."},
  {h:"Классификация антидепрессантов", p:[
   "<b>1. Ингибиторы нейронального захвата моноаминов</b>",
   "— неизбирательные (<b>трициклические, ТЦА</b>): амитриптилин, имипрамин",
   "— захват <b>серотонина</b> (СИОЗС): флуоксетин, сертралин, эсциталопрам",
   "— захват <b>норадреналина</b>: мапротилин",
   "— захват <b>серотонина и НА</b>: венлафаксин, милнаципран",
   "— блокатор пресинаптических <b>α2-АР</b>: миртазапин",
   "<b>2. Ингибиторы МАО</b>: неизбирательный (МАО-А и В) — <b>ниаламид</b>; избирательный МАО-А — <b>моклобемид</b>."],
   memo:"Сертралин, флуоксетин, эсциталопрам — «С» = Серотонин. МАпротилин — норАдреналин. Ниаламид — Необратимый, Неизбирательный."},
  {h:"Трициклические: амитриптилин, имипрамин", p:[
   "Блокируют обратный захват <b>НА, серотонина и дофамина</b> → медиаторы дольше в синапсе. Через <b>2–3 нед</b> — down-регуляция рецепторов.",
   "<b>Нельзя</b> вместе с неизбирательными иМАО — интервал <b>≥ 2 недель</b>.",
   "<b>Амитриптилин</b> — один из самых эффективных; + выраженный седативный, холиноблокирующий и антигистаминный эффекты. Показания: депрессии, тревожно-депрессивные и невротические состояния, <b>хронические боли</b>.",
   "ПЭ амитриптилина (блок М-холинорецепторов): сухость во рту, расширение зрачка, нарушение аккомодации, задержка мочи; аритмии, ортостатическая гипотензия (блок α-АР), сонливость, <b>прибавка веса</b>.",
   "<b>Имипрамин</b> — седация и холиноблокада слабее; применяют при <b>ночном энурезе у детей старше 6 лет</b>."],
   memo:"Амитриптилин = «атропин + снотворное»: сухо во рту, зрачок широкий, моча не идёт, хочется спать."},
  {h:"СИОЗС: флуоксетин, сертралин + серотониновый синдром", p:[
   "<b>Флуоксетин</b> — усиливает серотониновую активность, <b>седации почти нет</b>. ПЭ: снижение аппетита, тошнота, <b>акатизия</b> (неусидчивость), нервозность, бессонница, головная боль, сыпь.",
   "<b>Сертралин</b> — нет зависимости, нет М-холиноблокады, не меняет психомоторику, <b>не повышает вес</b>. Показания: депрессия и её профилактика, <b>ОКР</b>, панические расстройства, социальные фобии.",
   "<b>Серотониновый синдром</b>: спутанность сознания, возбуждение, мышечная ригидность, <b>гипертермия</b>, сосудистый коллапс. Возникает при СИОЗС + неизбирательные иМАО → интервал <b>≥ 2 нед</b>."],
   memo:"Флуоксетин бодрит (бессонница, без аппетита). Сертралин — «хороший мальчик»: без зависимости, без веса, без холиноблокады."},

   "<b>Венлафаксин</b> — блокирует захват НА и серотонина (действует и сам, и его <b>метаболит</b>). ПЭ: сонливость, головокружение, сухость во рту, <b>нарушения эякуляции</b>.",
   "<b>Миртазапин</b> — блокатор пресинаптических α2-адренорецепторов."]},
  {h:"Ингибиторы МАО и «сырный синдром»", p:[
   "<b>Ниаламид</b> — <b>необратимо и неизбирательно</b> блокирует МАО-А и МАО-В; антидепрессивный + <b>психостимулирующий</b> эффект (возбуждение, бессонница). Действие через <b>7–14 дней</b>. Показания: депрессия с вялостью и заторможенностью; уменьшает боль при <b>стенокардии</b>.",
   "ПЭ ниаламида: беспокойство, бессонница, тремор, судороги, ↓АД, ортостатическая гипотензия, <b>гепатотоксичность</b>, диспепсия, головная боль.",
   "<b>Сырный синдром</b>: иМАО + еда с <b>тирамином</b>. МАО заблокирована → тирамин попадает в кровь → выброс норадреналина → спазм сосудов → <b>гипертонический криз</b>. Головная боль «как удар молота», боль в сердце, судороги, светобоязнь, тошнота, рвота.",

   memo:"Сыр + вино + ниаламид = давление «в потолок». Моклобемид — «мягкий» иМАО: только А и обратимо."},
  {h:"Анксиолитики (транквилизаторы)", p:[

   "<b>Бензодиазепины:</b> короткие (1–12 ч) — триазолам, мидазолам; средние (12–40 ч) — клоназепам, алпразолам, феназепам; длительные (40–250 ч) — <b>диазепам</b>.",

   "<b>7 эффектов БЗД:</b> анксиолитический, седативный, снотворный, противосудорожный, миорелаксирующий, амнестический, потенцирование средств, угнетающих ЦНС."],
   memo:"7 эффектов БЗД: «Тревогу снял, Успокоил, Усыпил, Судороги убрал, Мышцы расслабил, Память стёр, Другим помог»."},

 cards:[

function topicPct(t){
  const parts=[get(t.id,"quiz"),get(t.id,"sort"),get(t.id,"tf"),get(t.id,"pairs"),get(t.id,"cards"),get(t.id,"read")];
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
const T = id => TOPICS.find(t=>t.id===id);

/* items with multiple groups */
function itemsOf(cls){
  const map={};
  for(const [g,arr] of Object.entries(cls.g)) for(const it of arr){ (map[it]=map[it]||[]).push(g); }
  return Object.entries(map).map(([name,groups])=>({name,groups}));
}

/* авто-вопросы из классификаций */
function autoQuestions(t){
  const qs=[];
  t.groups.forEach(cls=>{
    const groups=Object.keys(cls.g);
    if(groups.length<3) return;
    itemsOf(cls).forEach(it=>{
      const wrong=shuffle(groups.filter(g=>!it.groups.includes(g))).slice(0,3);
      if(wrong.length<2) return;
      const right=it.groups[0];
      qs.push({q:`«${it.name}» — к какой группе относится? <span class="sub">(${cls.name})</span>`,o:[right,...wrong],e:`${it.name}: ${it.groups.join("; ")}.`});
    });
    groups.forEach(g=>{
      const inG=cls.g[g];
      const others=shuffle(itemsOf(cls).filter(it=>!it.groups.includes(g)).map(it=>it.name)).slice(0,3);
      if(others.length<3) return;
      const right=pick(inG,1)[0];
      qs.push({q:`Что относится к группе «${g}»?`,o:[right,...others],e:`${g}: ${inG.join(", ")}.`});
    });
  });
  return qs;
}

/* --- Карточки --- */
function cardsMode(t){
  let queue=shuffle(t.cards.map((c,i)=>i)), known=new Set(), firstTry=new Set(t.cards.map((c,i)=>i)), flipped=false;
  function draw(){
    if(!queue.length){
      const pct=Math.round(known.size?([...known].filter(i=>firstTry.has(i)).length/t.cards.length*100):0);
      rec(t.id,"cards",pct);
      app.innerHTML=header("🃏 Карточки",t.id)+`<div class="card result"><div class="big">${pct}%</div><div>знал с первого раза</div><br><div class="row" style="justify-content:center"><button class="btn" onclick="route()">Ещё раз</button><button class="btn ghost" onclick="go('${t.id}-sort')">К игре →</button></div></div>`;
      return;
    }
    const i=queue[0], [q,a]=t.cards[i];
    app.innerHTML=header("🃏 Карточки",t.id)+`
     <div class="progress-line"><span>Осталось: ${queue.length}</span><span>Выучено: ${known.size}/${t.cards.length}</span></div>
     <div class="flip ${flipped?"on":""}" id="fl"><div class="inner">
       <div class="face"><div class="q">${q}</div><div class="hint">нажми, чтобы перевернуть</div></div>
       <div class="face back-f"><div class="a">${a}</div></div>
     </div></div>
     <div class="row"><button class="btn ghost" style="flex:1" id="no">🔁 Повторить</button><button class="btn" style="flex:1" id="yes">✅ Знаю</button></div>`;
    $("#fl").onclick=()=>{flipped=!flipped;$("#fl").classList.toggle("on")};
    $("#yes").onclick=()=>{known.add(i);queue.shift();flipped=false;draw();};
    $("#no").onclick=()=>{firstTry.delete(i);queue.push(queue.shift());flipped=false;draw();};
  }
  draw();
}

/* --- Тест / Экзамен --- */
function quiz(t){
  const isExam=!t;
  let pool;
  if(isExam){
    pool=[];
    TOPICS.forEach(tp=>{ pool.push(...pick(tp.quiz,3), ...pick(autoQuestions(tp),2)); });
    pool=shuffle(pool);
  } else {
    pool=shuffle([...pick(t.quiz,10),...pick(autoQuestions(t),5)]);
  }
  pool=pool.map(q=>{const right=q.o[0];return {...q,opts:shuffle(q.o),right};});
  let i=0,score=0,answered=false;
  const title=isExam?"🎯 Итоговый экзамен":"📝 Тест";
  const back=isExam?"":t.id;
  function draw(){
    if(i>=pool.length){
      const pct=Math.round(score/pool.length*100);
      if(isExam){ STORE.exam=Math.max(STORE.exam||0,pct); save(); } else rec(t.id,"quiz",pct);
      const mark=pct>=90?"Отлично! 🔥":pct>=75?"Хорошо 👍":pct>=60?"Удовлетворительно":"Нужно повторить 📖";
      app.innerHTML=header(title,back)+`<div class="card result"><div class="big">${pct}%</div><div><b>${mark}</b></div><div class="sub">${score} из ${pool.length} правильно</div><br><div class="row" style="justify-content:center"><button class="btn" onclick="route()">Пройти заново</button>${isExam?"":`<button class="btn ghost" onclick="go('${t.id}-read')">Конспект</button>`}</div></div>`;
      return;
    }
    const q=pool[i]; answered=false;
    app.innerHTML=header(title,back)+`
     <div class="progress-line"><span>Вопрос ${i+1} из ${pool.length}</span><span>✅ ${score}</span></div>
     <div class="bar" style="margin-bottom:10px"><i style="width:${i/pool.length*100}%"></i></div>
     <div class="q-title">${q.q}</div>
     <div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
     <div id="after"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(answered) return; answered=true;
      const chosen=q.opts[+b.dataset.k], ok=chosen===q.right;
      if(ok) score++;
      document.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(q.opts[+x.dataset.k]===q.right) x.classList.add("ok");});
      if(!ok) b.classList.add("no");
      $("#after").innerHTML=`<div class="expl">${ok?"✅ Верно! ":"❌ Неверно. "}${q.e||""}</div><button class="btn wide" id="nx">${i+1<pool.length?"Дальше →":"Результат"}</button>`;
      $("#nx").onclick=()=>{i++;draw();};
    });
  }
  draw();
}

/* --- Сортировка --- */
function sortMode(t){
  let ci=0;
  function start(){
    const cls=t.groups[ci], items=shuffle(itemsOf(cls)).slice(0,12), groups=Object.keys(cls.g);
    let i=0,score=0,streak=0,best=0,lock=false;
    function draw(){
      if(i>=items.length){
        const pct=Math.round(score/items.length*100); rec(t.id,"sort",pct);
        app.innerHTML=header("🗂️ Разложи по группам",t.id)+`<div class="card result"><div class="big">${pct}%</div><div>${score} из ${items.length} · лучшая серия ${best} 🔥</div><br><div class="row" style="justify-content:center"><button class="btn" onclick="sortMode(T('${t.id}'))">Ещё раз</button></div></div>`;
        return;
      }
      const it=items[i]; lock=false;
      app.innerHTML=header("🗂️ Разложи по группам",t.id)+
       `<div class="chips">${t.groups.map((c,k)=>`<button class="chip ${k===ci?"on":""}" data-c="${k}">${c.name}</button>`).join("")}</div>
       <div class="progress-line"><span>${i+1} / ${items.length}</span><span>✅ ${score} ${streak>1?`<span class="streak">· серия ${streak} 🔥</span>`:""}</span></div>
       <div class="drug">${esc(it.name)}</div>
       <div>${groups.map((g,k)=>`<button class="gbtn" data-g="${k}">${esc(g)}</button>`).join("")}</div>
       <div id="after"></div>`;
      document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ci=+c.dataset.c;start();});
      document.querySelectorAll(".gbtn").forEach(b=>b.onclick=()=>{
        if(lock) return; lock=true;
        const g=groups[+b.dataset.g], ok=it.groups.includes(g);
        if(ok){score++;streak++;best=Math.max(best,streak);} else streak=0;
        document.querySelectorAll(".gbtn").forEach(x=>{ if(it.groups.includes(groups[+x.dataset.g])) x.classList.add("ok"); });
        if(!ok) b.classList.add("no");
        if(ok){ setTimeout(()=>{i++;draw();},550); }
        else { $("#after").innerHTML=`<button class="btn wide" id="nx">Понял, дальше →</button>`; $("#nx").onclick=()=>{i++;draw();}; }
      });
    }
    draw();
  }
  start();
}

/* --- Пары --- */
function pairsMode(t){
  const set=pick(t.pairs,6);
  const L=shuffle(set.map((p,i)=>({i,txt:p[0]}))), R=shuffle(set.map((p,i)=>({i,txt:p[1]})));
  let sel=null,done=0,mistakes=0;
  app.innerHTML=header("🔗 Найди пару",t.id)+`
   <div class="progress-line"><span>Соедини препарат/термин с фактом</span><span id="st">ошибок: 0</span></div>
   <div class="pairs" id="pg">${L.map((l,k)=>`<button class="pc" data-s="L" data-i="${l.i}" style="grid-column:1;grid-row:${k+1}">${esc(l.txt)}</button>`).join("")}${R.map((r,k)=>`<button class="pc" data-s="R" data-i="${r.i}" style="grid-column:2;grid-row:${k+1};font-weight:500">${esc(r.txt)}</button>`).join("")}</div>
   <div id="after" style="margin-top:12px"></div>`;
  document.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("done")) return;
    if(!sel || sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove("sel"); sel=b; b.classList.add("sel"); return; }
    if(sel.dataset.i===b.dataset.i){
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); sel=null; done++;
      if(done===set.length){
        const pct=Math.max(0,Math.round(100-mistakes*100/ (set.length*2)));
        rec(t.id,"pairs",pct);
        $("#after").innerHTML=`<div class="card result"><div class="big">${pct}%</div><div>Все пары найдены! Ошибок: ${mistakes}</div><br><button class="btn" onclick="pairsMode(T('${t.id}'))">Новый набор</button></div>`;
      }
    } else {
      mistakes++; $("#st").textContent="ошибок: "+mistakes;
      const a=sel; a.classList.add("err"); b.classList.add("err");
      setTimeout(()=>{a.classList.remove("err","sel");b.classList.remove("err");},450); sel=null;
    }
  });
}

/* --- Верно/неверно --- */
function tfMode(t){
  const items=pick(t.tf,10); let i=0,score=0;
  function draw(){
    if(i>=items.length){
      const pct=Math.round(score/items.length*100); rec(t.id,"tf",pct);
      app.innerHTML=header("⚡ Верно / неверно",t.id)+`<div class="card result"><div class="big">${pct}%</div><div>${score} из ${items.length}</div><br><button class="btn" onclick="tfMode(T('${t.id}'))">Ещё раунд</button></div>`;
      return;
    }
    const [s,v,e]=items[i];
    app.innerHTML=header("⚡ Верно / неверно",t.id)+`
     <div class="progress-line"><span>${i+1} / ${items.length}</span><span>✅ ${score}</span></div>
     <div class="drug" style="font-size:19px">${esc(s)}</div>
     <div class="tf" id="tfb"><button class="btn f" data-v="0">✗ Неверно</button><button class="btn" data-v="1">✓ Верно</button></div>
     <div id="after" style="margin-top:12px"></div>`;
    let lock=false;
    document.querySelectorAll("#tfb .btn").forEach(b=>b.onclick=()=>{
      if(lock) return; lock=true;
      const ok=(b.dataset.v==="1")===v; if(ok) score++;
      $("#after").innerHTML=`<div class="expl">${ok?"✅ Правильно! ":"❌ Нет. "}${v?"Это верно. ":"Это неверно. "}${e}</div><button class="btn wide" id="nx">Дальше →</button>`;
      $("#nx").onclick=()=>{i++;draw();};
    });
  }
  draw();
}

initFirebase();
route();
</script>
