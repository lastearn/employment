<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вишлист Степы</title>
<meta name="description" content="Вишлист Степы (Lastearn): что мне подарить">
<meta property="og:title" content="Вишлист Степы 🎁">
<meta property="og:description" content="Что мне подарить — список с ссылками">
<meta name="theme-color" content="#0f0f14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
  :root{--bg:#0f0f14;--card:#181820;--card2:#20202a;--line:#2a2a36;--text:#f1f1f5;--muted:#8d8da0;
    --accent:#ff7a59;--accent2:#ffb36b;--r:18px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:radial-gradient(900px 500px at 85% -10%,#ff7a5922,transparent 60%),var(--bg)}
  .wrap{max-width:780px;margin:0 auto;padding:30px 16px 70px}
  header{padding:18px 4px 10px}
  .hello{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:600}
  h1{font-size:clamp(32px,9vw,48px);line-height:1.04;margin:8px 0 12px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0;max-width:540px;white-space:pre-line}
  .bar{display:flex;gap:10px;margin:18px 0 0}
  button{font:inherit;border:1px solid var(--line);cursor:pointer;border-radius:999px;padding:10px 17px;font-weight:600;
    background:var(--card2);color:var(--text)}
  button:active{transform:scale(.97)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;
    flex-direction:column;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
  a.card:hover{transform:translateY(-2px);border-color:#3b3b4a}
  .pic{aspect-ratio:4/3;background:linear-gradient(135deg,#262634,#1b1b24);display:grid;place-items:center;font-size:54px;overflow:hidden}
  .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .title{font-weight:700;font-size:17px;line-height:1.25;word-break:break-word}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .price{font-weight:700;color:var(--accent2)}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;color:#ffd0c2;background:#3a1f19;border:1px solid #5b2c22}
  .desc{color:var(--muted);font-size:14px;white-space:pre-line;word-break:break-word}
  .go{margin-top:auto;padding-top:4px;font-size:14px;font-weight:600;color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:56px 12px;border:1px dashed var(--line);border-radius:var(--r);margin-top:24px}
  footer{margin-top:44px;text-align:center;color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#2a2a36;padding:11px 16px;border-radius:12px;opacity:0;transition:.2s;font-size:14px;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hello" id="hello">вишлист</div>
    <h1 id="title">Вишлист</h1>
    <p class="sub" id="sub"></p>
    <div class="bar"><button id="share">Поделиться</button></div>
  </header>
  <main id="list"><div class="empty">Загружаю…</div></main>
  <footer>🎁 Lastearn</footer>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function h(tag, attrs){
    var el = document.createElement(tag), kids = [].slice.call(arguments, 2);
    for (var k in (attrs||{})){ var v = attrs[k]; if (v == null) continue;
      if (k === "class") el.className = v; else el.setAttribute(k, v); }
    kids.forEach(function(c){ if (c == null || c === false) return;
      el.appendChild(c.nodeType ? c : document.createTextNode(String(c))); });
    return el;
  }
  function safeUrl(u){ try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch(e){ return null; } }
  function fmtPrice(p){ if (p === "" || p == null) return null; var n = Number(String(p).replace(/\s/g,""));
    return isFinite(n) && n > 0 ? n.toLocaleString("ru-RU") + " ₽" : String(p); }
  var EMOJI = ["🎁","✨","🎧","📦","🛍️","💫","🎮","👟","📚","🧸"];
  var tt; function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove("on");},2200); }

  $("share").onclick = function(){
    var url = location.origin + location.pathname;
    if (navigator.share) navigator.share({ title: document.title, url: url }).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast("Ссылка скопирована"); });
  };

  function card(it, i){
    var url = safeUrl(it.url), img = safeUrl(it.image), price = fmtPrice(it.price);
    var pic = h("div", {class:"pic"});
    if (img){ var im = h("img", {src:img, alt:"", loading:"lazy", referrerpolicy:"no-referrer"});
      im.onerror = function(){ pic.textContent = EMOJI[i % EMOJI.length]; }; pic.appendChild(im); }
    else pic.textContent = it.emoji || EMOJI[i % EMOJI.length];
    var body = h("div", {class:"body"},
      h("div", {class:"title"}, it.title),
      (price || it.priority) ? h("div", {class:"meta"},
        price ? h("span", {class:"price"}, price) : null,
        it.priority ? h("span", {class:"chip"}, "🔥 очень хочу") : null) : null,
      it.note ? h("div", {class:"desc"}, it.note) : null,
      url ? h("div", {class:"go"}, "Где купить ↗") : null);
    return url ? h("a", {class:"card", href:url, target:"_blank", rel:"noopener noreferrer"}, pic, body)
               : h("div", {class:"card"}, pic, body);
  }

  fetch("wishes.json", {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
    $("hello").textContent = d.hello || "вишлист";
    $("title").textContent = d.title || "Вишлист";
    $("sub").textContent = d.sub || "";
    if (d.title) document.title = d.title;
    var items = (d.items || []).slice().sort(function(a,b){ return (b.priority?1:0) - (a.priority?1:0); });
    $("list").replaceChildren(items.length
      ? h.apply(null, ["div", {class:"grid"}].concat(items.map(card)))
      : h("div", {class:"empty"}, "Список скоро появится 🙂"));
  }).catch(function(){
    $("list").replaceChildren(h("div", {class:"empty"}, "Не получилось загрузить список, обнови страницу."));
  });
})();
</script>
</body>
</html>
