<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вишлист Степана</title>
<meta property="og:title" content="Вишлист Степана">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f4efe6;--ink:#1d1b18;--soft:#6f685d;--tape:#f3d98bcc;--pink:#ff8fa3;--blue:#8ec5ff;--green:#a6e3a1}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background-image:radial-gradient(#00000010 1px,transparent 1px);background-size:22px 22px}
  .wrap{max-width:880px;margin:0 auto;padding:44px 20px 90px}

  h1{font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(40px,12vw,92px);line-height:.95;
    margin:0;letter-spacing:-.03em}
  h1 .name{display:inline-block;background:var(--pink);padding:0 .12em;border-radius:.12em;transform:rotate(-2deg);margin-top:.08em}

  /* фото-коллаж */
  .photos{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:40px 0 10px;padding:0 6px}
  .ph{background:#fff;padding:9px 9px 34px;box-shadow:0 10px 25px #0000001f,0 2px 4px #00000014;width:min(42vw,210px);
    position:relative;transition:transform .2s}
  .ph:nth-child(3n+1){transform:rotate(-5deg)} .ph:nth-child(3n+2){transform:rotate(3deg) translateY(12px)}
  .ph:nth-child(3n){transform:rotate(-1.5deg)}
  .ph:hover{transform:rotate(0) scale(1.04);z-index:2}
  .ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
  .ph span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:600 21px Caveat,cursive;color:var(--soft)}
  .ph::before{content:"";position:absolute;top:-11px;left:50%;width:70px;height:22px;background:var(--tape);
    transform:translateX(-50%) rotate(-3deg)}

  /* подарки */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;margin-top:52px}
  .card{background:#fff;border-radius:6px;padding:10px 10px 16px;box-shadow:0 8px 22px #00000014,0 1px 3px #00000014;
    text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;position:relative}
  .card:nth-child(4n+1){transform:rotate(-1.2deg)} .card:nth-child(4n+2){transform:rotate(1deg)}
  .card:nth-child(4n+3){transform:rotate(-.4deg)} .card:nth-child(4n){transform:rotate(1.6deg)}
  a.card:hover{transform:rotate(0) translateY(-4px);box-shadow:0 16px 30px #0000001f}
  .pic{aspect-ratio:1;border-radius:3px;overflow:hidden;display:grid;place-items:center;font-size:46px;background:#f1ece2}
  .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .t{font-weight:700;font-size:16px;line-height:1.25;margin:12px 4px 0;word-break:break-word}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 4px 0}
  .price{font-family:Unbounded,sans-serif;font-weight:500;font-size:15px}
  .hot{font:600 22px Caveat,cursive;color:#d6336c;transform:rotate(-3deg);display:inline-block}
  .note{color:var(--soft);font-size:15px;margin:6px 4px 0;white-space:pre-line;word-break:break-word}
  .sticker{position:absolute;top:-12px;right:-10px;font-size:34px;transform:rotate(12deg);filter:drop-shadow(0 3px 4px #0003)}

  .empty{text-align:center;font:600 30px Caveat,cursive;color:var(--soft);margin-top:70px}
  .share{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border:0;cursor:pointer;
    width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:22px;
    box-shadow:0 8px 20px #0000003a}
  .share:active{transform:scale(.94)}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;font-size:15px;pointer-events:none}
  .toast.on{opacity:1}
  @media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:30px 24px}.t{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Вишлист<br><span class="name">Степана</span></h1>
  <div class="photos" id="photos"></div>
  <main id="list"></main>
</div>
<button class="share" id="share" aria-label="Поделиться">↗</button>
<div class="toast" id="toast"></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function h(tag, attrs){
    var el = document.createElement(tag), kids = [].slice.call(arguments, 2);
    for (var k in (attrs||{})){ var v = attrs[k]; if (v == null) continue;
      if (k === "class") el.className = v; else el.setAttribute(k, v); }
    kids.forEach(function(c){ if (c == null || c === false) return;
      el.appendChild(c.nodeType ? c : document.createTextNode(String(c))); });
    return el;
  }
  function safeUrl(u){ try { var x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : null; } catch(e){ return null; } }
  function fmtPrice(p){ if (p === "" || p == null) return null; var n = Number(String(p).replace(/\s/g,""));
    return isFinite(n) && n > 0 ? n.toLocaleString("ru-RU") + " ₽" : String(p); }
  var EMOJI = ["🎁"];
  var tt; function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove("on");},2000); }

  $("share").onclick = function(){
    var url = location.origin + location.pathname;
    if (navigator.share) navigator.share({ title: document.title, url: url }).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast("Ссылка скопирована"); });
  };

  function card(it, i){
    var url = safeUrl(it.url), img = it.image ? safeUrl(it.image) : null, price = fmtPrice(it.price);
    var pic = h("div", {class:"pic"});
    if (img){ var im = h("img", {src:img, alt:"", loading:"lazy", referrerpolicy:"no-referrer"});
      im.onerror = function(){ pic.textContent = EMOJI[i % EMOJI.length]; }; pic.appendChild(im); }
    else pic.textContent = it.emoji || EMOJI[i % EMOJI.length];
    var kids = [
      it.sticker ? h("div", {class:"sticker"}, it.sticker) : null,
      pic,
      h("div", {class:"t"}, it.title),
      (price || it.priority) ? h("div", {class:"row"},
        price ? h("span", {class:"price"}, price) : null,
        it.priority ? h("span", {class:"hot"}, "очень хочу!") : null) : null,
      it.note ? h("div", {class:"note"}, it.note) : null
    ];
    return url ? h.apply(null, ["a", {class:"card", href:url, target:"_blank", rel:"noopener noreferrer"}].concat(kids))
               : h.apply(null, ["div", {class:"card"}].concat(kids));
  }

  fetch("wishes.json", {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
    var photos = (d.photos || []).filter(function(p){ return p && safeUrl(p.src); });
    $("photos").replaceChildren.apply($("photos"), photos.map(function(p){
      return h("div", {class:"ph"}, h("img", {src:safeUrl(p.src), alt:"", loading:"lazy"}), p.caption ? h("span", {}, p.caption) : null);
    }));
    var items = (d.items || []).slice().sort(function(a,b){ return (b.priority?1:0) - (a.priority?1:0); });
    $("list").replaceChildren(items.length
      ? h.apply(null, ["div", {class:"grid"}].concat(items.map(card)))
      : h("div", {class:"empty"}, "пока пусто"));
  }).catch(function(){ $("list").replaceChildren(h("div", {class:"empty"}, "обнови страницу")); });
})();
</script>
</body>
</html>
