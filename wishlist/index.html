<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вишлист Степана</title>
<meta property="og:title" content="Вишлист Степана">
<meta name="theme-color" content="#121113">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#121113;--surf:#1a191c;--surf2:#222125;--text:#ece6dc;--muted:#8b857d;--acc:#d9b38c;--line:#ffffff0f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:radial-gradient(700px 420px at 15% -5%,#d9b38c14,transparent 70%),
               radial-gradient(600px 400px at 100% 30%,#7f8cff0d,transparent 70%),var(--bg)}
  .wrap{max-width:900px;margin:0 auto;padding:56px 20px 100px}

  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(44px,13vw,96px);line-height:.92;
    margin:0;letter-spacing:-.01em}
  h1 .name{font-style:italic;color:var(--acc)}

  .photos{display:flex;gap:12px;margin:40px 0 0;padding:0 0 6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .photos::-webkit-scrollbar{display:none}
  .ph{flex:0 0 auto;width:min(58vw,260px);scroll-snap-align:start;position:relative;border-radius:22px;overflow:hidden;background:var(--surf)}
  .ph img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  .ph span{position:absolute;left:14px;bottom:12px;font:italic 500 22px "Cormorant Garamond",serif;color:#fff;text-shadow:0 2px 12px #000a}
  .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,#0009);pointer-events:none}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 14px;margin-top:52px}
  .card{text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative}
  .pic{aspect-ratio:1;border-radius:20px;overflow:hidden;display:grid;place-items:center;font-size:40px;
    background:linear-gradient(145deg,var(--surf2),var(--surf));transition:transform .3s ease}
  .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  a.card:hover .pic img{transform:scale(1.04)}
  .t{font-weight:500;font-size:15px;line-height:1.3;margin:12px 2px 0;word-break:break-word}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:5px 2px 0}
  .price{color:var(--muted);font-size:14px}
  .hot{font-size:12px;color:var(--acc);border:1px solid #d9b38c40;border-radius:999px;padding:2px 9px}
  .note{color:var(--muted);font-size:13px;margin:4px 2px 0;white-space:pre-line;word-break:break-word}
  .sticker{position:absolute;top:8px;right:8px;font-size:22px;background:#0006;backdrop-filter:blur(6px);
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center}

  .empty{text-align:center;font:italic 500 26px "Cormorant Garamond",serif;color:var(--muted);margin-top:80px}
  .share{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);cursor:pointer;
    width:52px;height:52px;border-radius:50%;background:#1f1e22cc;backdrop-filter:blur(10px);color:var(--text);font-size:20px;
    box-shadow:0 10px 30px #0008}
  .share:active{transform:scale(.94)}
  .toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--surf2);color:var(--text);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;font-size:14px;pointer-events:none}
  .toast.on{opacity:1}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:36px 22px}.t{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Вишлист<br><span class="name">Степана</span></h1>
  <div class="photos" id="photos"></div>
  <main id="list"></main>
</div>
<button class="share" id="share" aria-label="Поделиться">↗</button>
<div class="toast" id="toast"></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function h(tag, attrs){
    var el = document.createElement(tag), kids = [].slice.call(arguments, 2);
    for (var k in (attrs||{})){ var v = attrs[k]; if (v == null) continue;
      if (k === "class") el.className = v; else el.setAttribute(k, v); }
    kids.forEach(function(c){ if (c == null || c === false) return;
      el.appendChild(c.nodeType ? c : document.createTextNode(String(c))); });
    return el;
  }
  function safeUrl(u){ try { var x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : null; } catch(e){ return null; } }
  function fmtPrice(p){ if (p === "" || p == null) return null; var n = Number(String(p).replace(/\s/g,""));
    return isFinite(n) && n > 0 ? n.toLocaleString("ru-RU") + " ₽" : String(p); }
  var EMOJI = ["🎁"];
  var tt; function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove("on");},2000); }

  $("share").onclick = function(){
    var url = location.origin + location.pathname;
    if (navigator.share) navigator.share({ title: document.title, url: url }).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast("Ссылка скопирована"); });
  };

  function card(it, i){
    var url = safeUrl(it.url), img = it.image ? safeUrl(it.image) : null, price = fmtPrice(it.price);
    var pic = h("div", {class:"pic"});
    if (img){ var im = h("img", {src:img, alt:"", loading:"lazy", referrerpolicy:"no-referrer"});
      im.onerror = function(){ pic.textContent = EMOJI[i % EMOJI.length]; }; pic.appendChild(im); }
    else pic.textContent = it.emoji || EMOJI[i % EMOJI.length];
    var kids = [
      it.sticker ? h("div", {class:"sticker"}, it.sticker) : null,
      pic,
      h("div", {class:"t"}, it.title),
      (price || it.priority) ? h("div", {class:"row"},
        price ? h("span", {class:"price"}, price) : null,
        it.priority ? h("span", {class:"hot"}, "очень хочу") : null) : null,
      it.note ? h("div", {class:"note"}, it.note) : null
    ];
    return url ? h.apply(null, ["a", {class:"card", href:url, target:"_blank", rel:"noopener noreferrer"}].concat(kids))
               : h.apply(null, ["div", {class:"card"}].concat(kids));
  }

  fetch("wishes.json", {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
    var photos = (d.photos || []).filter(function(p){ return p && safeUrl(p.src); });
    $("photos").replaceChildren.apply($("photos"), photos.map(function(p){
      return h("div", {class:"ph"}, h("img", {src:safeUrl(p.src), alt:"", loading:"lazy"}), p.caption ? h("span", {}, p.caption) : null);
    }));
    var items = (d.items || []).slice().sort(function(a,b){ return (b.priority?1:0) - (a.priority?1:0); });
    $("list").replaceChildren(items.length
      ? h.apply(null, ["div", {class:"grid"}].concat(items.map(card)))
      : h("div", {class:"empty"}, "пока пусто"));
  }).catch(function(){ $("list").replaceChildren(h("div", {class:"empty"}, "обнови страницу")); });
})();
</script>
</body>
</html>
