<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гистология — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4f8; --card:#ffffff; --ink:#1e1622; --muted:#6c6072; --line:#e6dfe9;
  --acc:#8a3a9e; --acc2:#f4e9f6; --bad:#d64545; --bad2:#fdecec; --good:#1f9d55; --good2:#e3f6ea;
  --warn:#b7791f; --warn2:#fdf3e1; --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141016; --card:#1e1822; --ink:#efe7f2; --muted:#a395a9; --line:#352b3a;
    --acc:#d48ae6; --acc2:#33223a; --bad:#ff7b7b; --bad2:#3a1d1d; --good:#4fd18b; --good2:#183324;
    --warn:#f2b45a; --warn2:#3a2d17; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
.back{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.topic{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.topic .ic{font-size:28px;width:46px;height:46px;display:grid;place-items:center;background:var(--acc2);border-radius:12px;flex:none}
.topic b{display:block;font-size:16px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:96px}
.mode .e{font-size:24px}
.mode b{display:block;margin-top:4px}
.mode small{color:var(--muted);display:block;font-size:12.5px}
.mode .best{color:var(--acc);font-weight:700;font-size:12.5px}
.btn{border:none;background:var(--acc);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* summary */
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.sec summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary:after{content:"＋";color:var(--muted)}
details.sec[open] summary:after{content:"－"}
details.sec .in{padding:0 16px 14px}
details.sec ul{margin:0;padding-left:20px}
details.sec li{margin:4px 0}
.memo{background:var(--warn2);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.memo:before{content:"💡 Запомни: ";font-weight:800}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:6px;padding:1px 6px;font-weight:700;font-size:.92em}
/* flashcards */
.flip{perspective:1000px;height:260px;margin-bottom:12px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;overflow:auto}
.flip .back-f{transform:rotateY(180deg);background:var(--acc2)}
.flip .face .q{font-size:19px;font-weight:700}
.flip .face .a{font-size:16px}
.flip .hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
/* quiz */
.q-title{font-size:18px;font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:500}
.opt.ok{border-color:var(--good);background:var(--good2)}
.opt.no{border-color:var(--bad);background:var(--bad2)}
.opt:disabled{cursor:default}
.expl{background:var(--acc2);border-radius:12px;padding:10px 12px;font-size:14.5px;margin:6px 0 12px}
.progress-line{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;margin-bottom:6px}
.result{text-align:center;padding:26px 16px}
.result .big{font-size:54px;font-weight:800;color:var(--acc)}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:58px;font-size:14px;text-align:center;font-weight:600}
.pc.sel{border-color:var(--acc);background:var(--acc2)}
.pc.done{opacity:.35;border-color:var(--good);cursor:default}
.pc.err{border-color:var(--bad);background:var(--bad2);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* sort */
.drug{font-size:24px;font-weight:800;text-align:center;padding:22px 10px;background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px}
.gbtn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:7px;font-weight:600;font-size:14.5px}
.gbtn.ok{border-color:var(--good);background:var(--good2)}
.gbtn.no{border-color:var(--bad);background:var(--bad2)}
.streak{font-weight:800;color:var(--warn)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .btn{padding:16px}
.tf .btn.f{background:var(--bad)}
.note{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
.hero{background:linear-gradient(135deg,#6d2a85,#d6457a);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:22px}
.hero p{margin:0;opacity:.9;font-size:14px}
.hero .btn{background:#fff;color:#6d2a85;margin-top:12px}
.modh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 2px 8px}
.modh b{font-size:15px}
.modh .sub{font-size:13px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--acc)}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.tools .mode{min-height:0;padding:12px;text-align:center}
.search{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.term{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.term b{display:block}
.term .src{font-size:12px;color:var(--muted);margin-top:2px}
mark{background:var(--warn2);color:inherit;border-radius:3px}
details.mod{margin-bottom:4px}
details.mod>summary{list-style:none;cursor:pointer}
details.mod>summary::-webkit-details-marker{display:none}
</style>
</head>

<script>

const TOPICS=[];
/* ===== МОДУЛЬ А. Введение в гистологию (темы 1–6) ===== */
TOPICS.push(
{
 id:"t1", mod:"A", icon:"🔬", title:"1. Техника гистологического исследования",
 summary:[
  {h:"Световой микроскоп", p:[
   "Две системы: <b>оптическая</b> (окуляр, объектив, конденсор, зеркало/осветитель) и <b>механическая</b> (штатив, тубус, предметный столик, макро- и микровинт).",
   "<b>Общее увеличение = увеличение окуляра × увеличение объектива</b>: например, 20 × 10 = 200 раз.",

  {h:"Этапы приготовления препарата", p:[
   "<b>1. Взятие и фиксация</b>: кусочки ≈ 0,5×1×1 см кладут в фиксатор (<b>формалин</b>, метанол) обычно на <b>24 ч</b> — фиксация останавливает аутолиз и сохраняет структуру.",

  {h:"ЭПС и комплекс Гольджи", p:[
   "<b>Гранулярная ЭПС</b> — цистерны с <b>рибосомами</b>; синтез белков на экспорт, мембранных и лизосомных белков. Обусловливает <b>базофилию</b> цитоплазмы (много в плазмоцитах, ацинарных клетках поджелудочной).",
   "<b>Гладкая ЭПС</b> — без рибосом: синтез <b>липидов и стероидов</b>, обмен гликогена, <b>детоксикация</b> (гепатоциты), депо <b>Ca²⁺</b> (саркоплазматическая сеть мышц).",
   "<b>Комплекс Гольджи</b> (диктиосомы — стопки цистерн): <b>цис-</b>полюс принимает, <b>транс-</b>полюс отдаёт. Функции: модификация белков (гликозилирование), сортировка, упаковка в секреторные гранулы, образование первичных лизосом.",
   "В клетке с ярким Гольджи на препарате видна светлая зона около ядра — «негативный образ» комплекса."],
   memo:"Шероховатая — белки, гладкая — жиры и яды. Гольджи — «почтовое отделение»: доработать, упаковать, отправить."},
  {h:"Лизосомы и пероксисомы", p:[
   "<b>Лизосомы</b> — пузырьки с <b>кислыми гидролазами</b> (оптимум pH ≈ 5); маркер — <b>кислая фосфатаза</b>.",
   "Типы: <b>первичные</b> (из Гольджи) → <b>вторичные</b>: <b>фаголизосомы</b> (гетерофагия) и <b>аутофаголизосомы</b> (переваривание собственных органелл) → <b>остаточные тельца</b> (липофусцин — «пигмент старения»).",
   "<b>Пероксисомы</b> — пузырьки с <b>оксидазами</b> (образуют H₂O₂) и <b>каталазой</b> (разрушает H₂O₂); окисление жирных кислот, детоксикация. Много в гепатоцитах и клетках проксимальных канальцев почки."],
   memo:"Лизосома — «желудок» клетки (кислая среда). Пероксисома — «каталаза против перекиси»."},
  {h:"Рибосомы и митохондрии", p:[
   "<b>Рибосомы</b> — две субъединицы (у эукариот 80S = 60S + 40S); <b>свободные</b> (белки для самой клетки) и <b>связанные</b> с ЭПС (белки на экспорт). <b>Полисома</b> — несколько рибосом на одной мРНК.",
   "<b>Фолдинг</b> белков (сворачивание) помогают <b>шапероны</b>.",
   "<b>Митохондрии</b>: наружная мембрана, межмембранное пространство, внутренняя мембрана с <b>кристами</b>, <b>матрикс</b>. На кристах — грибовидные <b>F1-частицы</b> (оксисомы) с <b>АТФ-синтетазой</b>.",
   "В матриксе — цикл Кребса, β-окисление жирных кислот; на внутренней мембране — дыхательная цепь и окислительное фосфорилирование.",
   "Своя кольцевая <b>мтДНК</b> и рибосомы, но сами синтезируют лишь ≈<b>5%</b> своих белков; мутации мтДНК в 10 раз чаще; живут около <b>10 суток</b>; размножаются делением."],
   memo:"Митохондрия — «электростанция»: кристы + F1-частицы = АТФ. Живёт ~10 суток, синтезирует лишь 5% своих белков."},
  {h:"Цитоскелет и клеточный центр", p:[
   "<b>Микрофиламенты</b> — актин, d = <b>5–7 нм</b>: двигательные процессы, микроворсинки, кортикальный слой, сокращение.",
   "<b>Промежуточные филаменты</b> — d = <b>10 нм</b>; белок <b>тканеспецифичен</b>: кератины (эпителий), виментин (мезенхимные), десмин (мышцы), нейрофиламенты, глиальный фибриллярный кислый белок (астроциты), ламины (ядро). Опорная функция.",
   "<b>Микротрубочки</b> — полые цилиндры из <b>тубулина</b>, d = <b>24 нм</b> (внутренний 14 нм), на срезе <b>13</b> субъединиц. Внутриклеточный транспорт (кинезин, динеин), веретено деления, реснички. Разрушаются <b>колхицином</b>.",
   "<b>Клеточный центр</b> (центросома) — две <b>центриоли</b> под прямым углом; каждая — <b>9 триплетов</b> микротрубочек (9×3+0). Центр организации микротрубочек; удваивается в S-периоде."],
   memo:"Толщина: актин 5–7 → промежуточные 10 → трубочки 24 нм. Центриоль — 9×3 + 0."}

{
 id:"t4", mod:"A", icon:"🧬", title:"4. Ядро клетки. Деление клетки",
 summary:[
  {h:"Ядро: состав и функции", p:[
   "Компоненты интерфазного ядра: <b>ядерная оболочка</b>, <b>хроматин</b>, <b>ядрышко</b>, <b>кариоплазма</b> (нуклеоплазма) и <b>ядерный матрикс</b>.",
   "Функции: хранение и <b>репликация</b> ДНК, <b>репарация</b>, <b>транскрипция</b> (синтез всех видов РНК), процессинг РНК, образование субъединиц рибосом.",
   "Средняя длина молекулы ДНК — <b>4 см</b>; все 46 молекул диплоидной клетки — ≈<b>185 см</b>.",
   "Эффективность репарации снижается у взрослых примерно на 1% в год."],
   memo:"Ядро = оболочка + хроматин + ядрышко + кариоплазма + матрикс."},
  {h:"Хроматин и укладка ДНК", p:[
   "<b>Эухроматин</b> — деконденсированный, активный (светлый). <b>Гетерохроматин</b> — конденсированный, неактивный (тёмные глыбки). Пример факультативного — <b>тельце Барра</b> (инактивированная Х-хромосома у женщин; «барабанная палочка» в нейтрофилах).",
   "Белки: <b>гистоны</b> (H1, H2A, H2B, H3, H4 — 60–80% массы белков) и негистоновые.",
   "Уровни укладки: <b>нуклеосомная нить</b> 10 нм (ДНК вокруг октамера гистонов) → <b>хроматиновая фибрилла</b> 30 нм → <b>хромонема</b> 300 нм (петли-розетки) → <b>хроматида</b> 700 нм → метафазная хромосома 1400 нм.",
   "Итог — укорочение ДНК в <b>10 000 раз</b>."],
   memo:"Укладка: 10 → 30 → 300 → 700 → 1400 нм. Эу — «эу, работаю», гетеро — «спит»."},
  {h:"Хромосомы и кариотип", p:[
   "Метафазная хромосома: две <b>хроматиды</b>, <b>центромера</b> (первичная перетяжка) с <b>кинетохором</b>, плечи, <b>теломеры</b>; у некоторых — вторичная перетяжка (ядрышковый организатор).",
   "Типы по положению центромеры: <b>метацентрические</b> (плечи равны), <b>субметацентрические</b>, <b>акроцентрические</b> (одно плечо очень короткое).",
   "<b>Кариотип человека</b>: 46 хромосом = 22 пары аутосом + XX или XY; 7 групп (A–G).",
   "Ядрышковые организаторы — на акроцентрических хромосомах 13, 14, 15, 21, 22."],
   memo:"Метацентрик — центр посередине, акроцентрик — центромера у края."},
  {h:"Ядрышко и ядерная оболочка", p:[
   "<b>Ядрышко</b> — место синтеза <b>рРНК</b> и сборки субъединиц рибосом. Компоненты: <b>фибриллярный</b> (транскрипция пре-рРНК), <b>гранулярный</b> (созревающие субъединицы), ядрышковый организатор.",
   "Схема: 45S пре-рРНК → 28S, 18S, 5,8S рРНК.",
   "<b>Ядерная оболочка</b> = 2 мембраны + перинуклеарное пространство; наружная мембрана переходит в ЭПС, несёт рибосомы. Изнутри — <b>ядерная ламина</b> (ламины).",
   "<b>Ядерная пора</b> — диаметр ≈<b>120 нм</b>, комплекс поры (поросома) — диафрагма с каналами ≈10 нм; транспорт белков в ядро и РНК из ядра."],
   memo:"Ядрышко — «фабрика рибосом». Пора — 120 нм."},
  {h:"Клеточный цикл и его регуляция", p:[
   "Митотический цикл: <b>интерфаза</b> (G1 → S → G2) + <b>митоз</b> (М). Для быстро делящихся клеток: G1 ≈ 9 ч, S ≈ 10 ч, G2 ≈ 4,5 ч, М ≈ 0,5 ч — итого ≈<b>24 ч</b>.",
   "<b>G1</b> — рост, синтез белков и РНК; <b>S</b> — <b>репликация ДНК</b> (2n4c), удвоение центриолей; <b>G2</b> — подготовка к митозу.",
   "<b>G0</b> — выход из цикла (покоящиеся клетки). Клетки бывают <b>митотические</b> (камбиальные), <b>условно постмитотические</b> (гепатоциты — могут вернуться в цикл) и <b>постмитотические</b> (нейроны, кардиомиоциты).",
   "Регуляция: <b>циклины + циклинзависимые киназы (Cdk)</b>; контрольные точки; белок <b>p53</b> останавливает цикл при повреждении ДНК."],
   memo:"G1 — растём, S — копируем ДНК, G2 — готовимся, М — делимся. Сутки на цикл."},
  {h:"Митоз и гибель клеток", p:[
   "<b>Профаза</b> — конденсация хромосом, распад ядрышка и ядерной оболочки (в конце — прометафаза), образование веретена.",
   "<b>Метафаза</b> — хромосомы на экваторе: <b>метафазная пластинка</b> (вид сбоку) / «материнская звезда» (вид с полюса).",

{
 id:"t8", mod:"B", icon:"🩸", title:"8. Кровь",
 summary:[
  {h:"Состав крови", p:[
   "Объём крови взрослого — около <b>5 л</b>. Плазма — <b>55–60%</b>, форменные элементы — <b>40–45%</b> (гематокрит).",
   "Плазма: вода ≈90%, белки <b>6,5–8,5%</b> (альбумины, глобулины, фибриноген), липиды, метаболиты, ионы. <b>Сыворотка</b> = плазма без фибриногена.",
   "По учебнику: эритроциты — <b>5·10¹²/л</b>, лейкоциты — <b>6·10⁹/л</b>, тромбоциты — <b>2,5·10¹¹/л</b>.",
   "Эритроцитов в ≈1000 раз больше, чем лейкоцитов, и в 20 раз больше, чем тромбоцитов.",
   "Мазок крови красят <b>по Романовскому</b> (азур II–эозин)."],
   memo:"5 л крови; плазма 55–60%. Эритроциты 5·10¹², лейкоциты 6·10⁹, тромбоциты 2,5·10¹¹ в литре."},
  {h:"Эритроциты", p:[
   "<b>Постклеточные</b> структуры: нет ядра и органелл. 85% — <b>двояковогнутые диски</b> (дискоциты) диаметром <b>7,5 мкм</b>.",
   "Другие формы (пойкилоцитоз): сфероциты, эхиноциты, стоматоциты. Нормоциты 7,5 мкм; <b>микроциты</b> меньше, <b>макроциты</b> больше (анизоцитоз).",
   "<b>Ретикулоциты</b> — незрелые формы, <b>1–2%</b>; выявляются суправитальной окраской (бриллиантовый крезиловый синий) — сеточка из остатков рибосом.",
   "Срок циркуляции — <b>120 суток</b>; разрушаются макрофагами селезёнки.",
   "Белки плазмолеммы: <b>спектрин</b> (цитоскелет), гликофорин, полоса 3 (обмен Cl⁻/HCO₃⁻). Групповые антигены: <b>AB0</b>, <b>резус</b>.",
   "<b>Гемоглобин</b> (2α + 2β цепи + гем с Fe²⁺): у взрослых <b>HbA ≈ 96%</b>, HbA2 и HbF по 2%; HbF — у плода, выше сродство к O₂."],
   memo:"Эритроцит: 7,5 мкм, без ядра, 120 суток. Ретикулоциты 1–2% — индикатор кроветворения."},
  {h:"Лейкоцитарная формула (по учебнику)", p:[
   "<b>Нейтрофилы</b>: юные 0–0,5%, палочкоядерные 3–5%, сегментоядерные <b>65–70%</b>.",
   "<b>Эозинофилы</b> 2–4%, <b>базофилы</b> 0,5–1%.",
   "<b>Моноциты</b> 6–8%, <b>лимфоциты</b> 20–30%.",
   "<b>Гранулоциты</b> (нейтрофилы, эозинофилы, базофилы) — сегментированное ядро и специфические гранулы; <b>агранулоциты</b> — моноциты и лимфоциты.",
   "Лейкоциты циркулируют в крови всего <b>4–12 ч</b>, затем мигрируют в ткани (<b>диапедез</b>: адгезия к эндотелию → проникновение между клетками)."],
   memo:"Формула «нейтрофилы ~70, лимфоциты ~25, моноциты ~7, эозинофилы ~3, базофилы ~1»."},
  {h:"Гранулоциты", p:[
   "<b>Нейтрофилы</b> (10–15 мкм): ядро из 3–4 сегментов (у женщин — «барабанная палочка»). Гранулы: <b>первичные азурофильные</b> (10–20%, лизосомы, миелопероксидаза) и <b>вторичные специфические</b> (≈80%, лизоцим, лактоферрин). Функция — <b>фагоцитоз бактерий</b> («микрофаги»), главные клетки острого воспаления.",
   "<b>Эозинофилы</b> (12–17 мкм): ядро <b>двухсегментное</b>; крупные оранжево-розовые гранулы с кристаллоидом (главный основный белок, гистаминаза). Функции: <b>противопаразитарная</b>, инактивация гистамина, регуляция аллергических реакций.",
   "<b>Базофилы</b> (9–12 мкм): ядро слабосегментированное, закрыто крупными <b>метахроматическими</b> гранулами (<b>гистамин, гепарин</b>). Участвуют в <b>аллергических реакциях</b> (IgE-рецепторы), регулируют свёртывание и проницаемость сосудов.",
   "Гранулоциты <b>не делятся</b>."],
   memo:"Нейтрофил — «боец» с бактериями; эозинофил — против паразитов и аллергии; базофил — гистамин и гепарин (аллергия)."},
  {h:"Агранулоциты", p:[
   "<b>Лимфоциты</b>: малые 6–7 мкм (80–85%), средние 8–9 мкм, большие 12–15 мкм. Округлое тёмное ядро, узкий ободок базофильной цитоплазмы.",
   "<b>Т-лимфоциты</b> ≈65% (созревают в тимусе): Т-хелперы (CD4), цитотоксические Т-киллеры (CD8), Т-супрессоры (регуляторные), Т-памяти. Клеточный иммунитет.",
   "<b>В-лимфоциты</b> ≈30% (созревают в красном костном мозге): при стимуляции антигеном превращаются в <b>плазмоциты</b>, синтезирующие <b>иммуноглобулины</b> — гуморальный иммунитет. <b>NK-клетки</b> — естественные киллеры.",
   "<b>Моноциты</b> — самые крупные клетки мазка (18–20 мкм): <b>бобовидное</b> светлое ядро, широкая серо-голубая цитоплазма. В тканях → <b>макрофаги</b> (система мононуклеарных фагоцитов)."],
   memo:"Т — Тимус, клеточный иммунитет; В — Bone marrow, антитела через плазмоциты. Моноцит — крупный, ядро-«фасоль», в тканях — макрофаг."},
  {h:"Тромбоциты", p:[
   "<b>Кровяные пластинки</b> — фрагменты цитоплазмы <b>мегакариоцитов</b> красного костного мозга; размер <b>2–3 мкм</b>; ядра нет.",
   "<b>Гиаломер</b> — светлая периферическая часть (цитоскелет, канальцы); <b>грануломер</b> — центральная часть с гранулами (α-гранулы — факторы свёртывания, фибриноген, фактор роста; плотные — серотонин, АДФ, Ca²⁺).",
   "Функция — <b>гемостаз</b>: адгезия и агрегация, образование тромба, выделение факторов свёртывания.",
   "Живут 5–10 дней (ориентировочно), разрушаются в селезёнке."],
   memo:"Тромбоцит = кусочек мегакариоцита: гиаломер (край) + грануломер (центр с гранулами)."}
 ],

{
 id:"t9", mod:"B", icon:"🕸️", title:"9. Собственно соединительные ткани",
 summary:[
  {h:"Классификация соединительных тканей", p:[
   "Все происходят из <b>мезенхимы</b>; много межклеточного вещества (волокна + основное аморфное вещество).",
   "<b>Собственно соединительные (волокнистые)</b>: <b>рыхлая</b> волокнистая и <b>плотная</b> (неоформленная и оформленная).",
   "<b>Со специальными свойствами</b>: ретикулярная, жировая (белая и бурая), слизистая, пигментная.",
   "<b>Скелетные</b>: хрящевые и костные (тема 10).",
   "Функции: опорная, трофическая, защитная (иммунная, фагоцитоз), пластическая (заживление ран), депо (жир, вода)."],
   memo:"Соединительная ткань = клетки + волокна + аморфное вещество; всё — из мезенхимы."},
  {h:"Рыхлая волокнистая соединительная ткань: клетки", p:[
   "<b>Фибробласты</b> — главные клетки: синтезируют коллаген, эластин, протеогликаны. Отростчатые, базофильная цитоплазма (много гр. ЭПС). Дифферон: стволовые → полустволовые → малоспециализированные → дифференцированные фибробласты → <b>фиброциты</b> (неактивные). Также <b>миофибробласты</b> (сокращают рану), фиброкласты.",
   "<b>Макрофаги</b> (гистиоциты) — из моноцитов: фагоцитоз, презентация антигенов, секреция цитокинов. Неровный контур, много лизосом.",
   "<b>Плазмоциты</b> — из В-лимфоцитов: синтез антител. Эксцентричное ядро с хроматином «<b>колесо со спицами</b>», резко базофильная цитоплазма, «<b>светлый дворик</b>» (Гольджи) у ядра.",
   "<b>Тучные клетки</b> (тканевые базофилы, лаброциты) — вдоль сосудов; <b>метахроматические</b> гранулы с <b>гистамином и гепарином</b>; регуляция проницаемости, аллергия (IgE).",
   "<b>Адипоциты</b>, <b>меланоциты</b> (пигментоциты), <b>адвентициальные клетки</b> (камбий вдоль сосудов), перициты, лейкоциты."],
   memo:"Фибробласт — строитель; макрофаг — уборщик; плазмоцит — «фабрика антител» (колесо со спицами); тучная клетка — гистамин и гепарин."},
  {h:"Коллагеновые волокна", p:[
   "Самые прочные (на разрыв), не растяжимы; оксифильны (розовые); <b>Маллори — синие</b>, ван Гизон — красные.",
   "Уровни организации: <b>тропоколлаген</b> (d 1,4 нм, длина 280 нм; 3 α-цепи) → <b>протофибриллы</b> (5–10 нм) → <b>фибриллы</b> (50–100 нм, исчерченность) → <b>волокна</b> (1–3 мкм) → пучки.",
   "В α-цепях много <b>глицина</b> (33%), пролина, лизина, гидроксипролина и гидроксилизина (гидроксилирование требует <b>витамина С</b>).",
   "Типы: <b>I</b> — кожа, кость, сухожилия; <b>II</b> — гиалиновый и эластический хрящ; <b>III</b> — ретикулярные волокна; <b>IV</b> — базальные мембраны.",
   "Образование: внутриклеточный этап (синтез проколлагена) → внеклеточный (отщепление пептидов, сборка фибрилл)."],
   memo:"Коллаген: тропоколлаген → протофибрилла → фибрилла → волокно. I — кость/кожа, II — хрящ, III — ретикулин, IV — базальная мембрана."},
  {h:"Эластические волокна и аморфное вещество", p:[
   "<b>Эластические</b> волокна — растяжимы, ветвятся, образуют сети; окраска <b>орсеином</b> (коричневые).",
   "Состав: аморфный <b>эластин</b> (в зрелом волокне ≈90%) + <b>микрофибриллы</b> из <b>фибриллина</b> (10–12 нм). Стадии: окситалановые (только микрофибриллы) → элауниновые (≈50% эластина) → зрелые.",
   "<b>Ретикулярные</b> волокна — коллаген III типа, аргирофильны (серебро).",
   "<b>Основное аморфное вещество</b> — гель: вода, <b>гликозаминогликаны</b> (гиалуроновая кислота, хондроитинсульфаты), <b>протеогликаны</b>, гликопротеины (фибронектин); тканевая жидкость."],
   memo:"Эластика = эластин + фибриллин. Ретикулин = коллаген III + серебро."},
  {h:"Плотные волокнистые ткани", p:[
   "<b>Плотная неоформленная</b> — пучки коллагена идут в разных направлениях: <b>сетчатый слой дермы</b>, капсулы органов.",
   "<b>Плотная оформленная коллагенового типа</b> — параллельные пучки: <b>сухожилия</b>, связки, фасции. В сухожилии: пучки I порядка (между ними — <b>сухожильные клетки</b>, фиброциты), II порядка (с эндотенонием), III порядка (перитеноний).",
   "<b>Плотная оформленная эластического типа</b> — выйная связка, жёлтые связки позвоночника."],
   memo:"Неоформленная — дерма; оформленная — сухожилие (пучки I, II, III порядка)."},
  {h:"Ткани со специальными свойствами", p:[
   "<b>Ретикулярная ткань</b> — ретикулярные клетки + ретикулярные волокна; строма <b>кроветворных органов</b> (красный костный мозг, лимфоузлы, селезёнка).",
   "<b>Белая жировая ткань</b> — <b>однокапельные</b> адипоциты: крупная жировая капля, ядро оттеснено к краю («перстневидная» клетка). Функции: энергетическое депо, термоизоляция, механическая защита, эндокринная (<b>лептин</b>).",
   "<b>Бурая жировая ткань</b> — <b>многокапельные</b> адипоциты, много <b>митохондрий</b> (цитохромы дают бурый цвет); белок <b>термогенин</b> (UCP-1) разобщает окисление и фосфорилирование → <b>теплопродукция</b>. Есть у новорождённых (межлопаточная область).",
   "На срезах жир растворяется — видны пустые клетки; для выявления — <b>судан III</b>."],
   memo:"Белый жир — одна большая капля (запас). Бурый — много капель и митохондрий (греет; термогенин)."}
 ],

{
 id:"t10", mod:"B", icon:"🦴", title:"10. Хрящевые и костные ткани",
 summary:[
  {h:"Хрящ: общая характеристика", p:[
   "Три вида: <b>гиалиновый</b> (суставные поверхности, метафизы растущих костей, хрящи гортани, трахеи, бронхов, передние концы рёбер), <b>эластический</b> (ушная раковина, хрящи носа, средних бронхов, надгортанник), <b>волокнистый</b> (межпозвонковые диски, лобковый симфиз, места прикрепления сухожилий).",
   "Межклеточное вещество: вода <b>70–80%</b>, минеральные вещества 4–7%, органика 10–15%. <b>Сосудов нет</b> — питание диффузией из надхрящницы.",
   "<b>Надхрящница</b>: наружный слой — плотная волокнистая ткань с сосудами; внутренний — <b>хондрогенный</b> (хондробласты).",
   "Клетки: <b>хондробласты</b> (у надхрящницы) → <b>хондроциты</b> в лакунах. <b>Изогенные группы</b> — 2–6 хондроцитов от одной клетки в общей лакуне.",
   "Рост: <b>аппозиционный</b> (за счёт надхрящницы, снаружи) и <b>интерстициальный</b> (изнутри, делением хондроцитов)."],
   memo:"Хрящ без сосудов, питается из надхрящницы. Изогенная группа = «семья» хондроцитов в одной лакуне."},
  {h:"Виды хряща: отличия", p:[
   "<b>Гиалиновый</b>: коллаген <b>II</b> типа (фибриллы не видны — показатель преломления как у матрикса). Вокруг изогенных групп — <b>территориальный матрикс</b> (базофильный); между ними — интертерриториальный (оксифильный).",
   "<b>Эластический</b>: + сеть <b>эластических волокон</b> (орсеин); не обызвествляется.",
   "<b>Волокнистый</b>: много параллельных пучков коллагена <b>I</b> типа; хондроциты лежат цепочками; надхрящницы нет.",
   "С возрастом гиалиновый хрящ может обызвествляться."],
   memo:"Гиалиновый — «матовое стекло», эластический — «сеточка орсеином», волокнистый — «пучки и цепочки клеток»."},
  {h:"Кость: состав и клетки", p:[
   "Межклеточное вещество: минеральные соли <b>60–70%</b> (фосфат кальция, <b>гидроксиапатит</b>), вода 6–20%, органика 10–20% (из неё <b>95% — коллаген I</b> типа + остеокальцин, остеонектин, щелочная фосфатаза).",
   "<b>Остеобласты</b> — строят кость: синтез органического матрикса (остеоида), щелочной фосфатазы; базофильная цитоплазма; на поверхности костных балок.",
   "<b>Остеоциты</b> — зрелые клетки в <b>лакунах</b>, отростки в <b>костных канальцах</b>; не делятся; поддерживают матрикс.",
   "<b>Остеокласты</b> — разрушают кость: крупные <b>многоядерные</b> (симпласты из <b>моноцитов</b>), <b>гофрированная каёмка</b>, много лизосом; лежат в лакунах резорбции (Хаушипа).",
   "<b>Надкостница</b>: наружный волокнистый слой и внутренний <b>остеогенный</b> (камбий); <b>прободающие (шарпеевы) волокна</b> крепят её к кости."],
   memo:"ОстеоБласт — Билдер (строит), ОстеоКласт — Крушит, ОстеоЦит — Царствует в лакуне. Кластов делают моноциты."},
  {h:"Грубоволокнистая и пластинчатая кость", p:[
   "<b>Грубоволокнистая (ретикулофиброзная)</b>: пучки коллагена беспорядочно; у зародыша, у взрослых — в швах черепа, местах прикрепления сухожилий, в костной мозоли.",
   "<b>Пластинчатая</b>: <b>костные пластинки</b> 4–15 мкм, в соседних пластинках коллагеновые фибриллы под углом.",
   "<b>Компактное вещество диафиза</b> (снаружи внутрь): <b>наружные генеральные пластинки</b> → <b>остеонный слой</b> (остеоны + вставочные пластинки) → <b>внутренние генеральные пластинки</b> → эндост.",
   "<b>Остеон (гаверсова система)</b> — 4–20 концентрических пластинок вокруг <b>центрального (гаверсова) канала</b> с сосудом; снаружи — спайная (цементирующая) линия. Каналы соединяются <b>прободающими (фолькмановыми)</b> каналами.",
   "<b>Губчатое вещество</b> — трабекулы (балки) из пластинок, между ними — красный костный мозг."],
   memo:"Остеон = гаверсов канал + концентрические пластинки. Вставочные пластинки — «остатки» старых остеонов."},
  {h:"Остеогенез", p:[
   "<b>Прямой</b> (из мезенхимы) — <b>плоские кости</b> черепа, челюсти: 1) образование остеогенного островка; 2) остеоидный этап (синтез матрикса); 3) <b>минерализация</b>; 4) перестройка грубоволокнистой кости в пластинчатую.",
   "<b>Непрямой</b> (на месте хряща) — <b>трубчатые кости</b>: хрящевая модель → <b>перихондральная</b> костная манжетка в диафизе → <b>энхондральное</b> окостенение (хрящ разрушается, сосуды с остеогенными клетками врастают) → первичный центр в диафизе, вторичные — в эпифизах.",
   "<b>Метаэпифизарная пластинка</b> роста — зоны: резервная (неизменённый хрящ) → <b>столбчатого</b> хряща (колонки хондроцитов) → <b>пузырчатого</b> (гипертрофированного) хряща → обызвествления → окостенения.",
   "Рост кости в длину — за счёт метаэпифизарной пластинки, в толщину — за счёт надкостницы (аппозиционный)."],
   memo:"Прямой — плоские кости (череп), непрямой — трубчатые (через хрящ). Пластинка роста: покой → столбики → пузыри → кость."},
  {h:"Перестройка и регуляция", p:[
   "Кость постоянно перестраивается: в среднем возрасте за год обновляется ≈<b>8%</b> костной массы (компактное вещество — 4%, губчатое — 20%). После 35 лет резорбция начинает преобладать.",
   "<b>Витамин D</b> — всасывание Ca²⁺ в кишке, минерализация (дефицит — <b>рахит</b>); <b>витамин С</b> — синтез коллагена (цинга); <b>витамин А</b> — баланс роста.",
   "<b>Паратирин</b> (околощитовидные железы) — активирует остеокласты → ↑Ca²⁺ в крови. <b>Кальцитонин</b> (C-клетки щитовидной железы) — тормозит остеокласты → ↓Ca²⁺.",
   "<b>Соматотропин</b> — рост метаэпифизарных пластинок; <b>эстрогены</b> — тормозят резорбцию (климакс → остеопороз); глюкокортикоиды — усиливают резорбцию."],
   memo:"ПАРАтирин — «ПАРА» остеокластов, выносит Ca в кровь. КальциТОНИН — «тонет» кальций обратно в кость."}
 ],

  {h:"Классификация мышечных тканей", p:[

   "<b>Макроглия</b> (из нервной трубки/гребня): <b>эпендимная</b>, <b>астроглия</b>, <b>олигодендроглия</b>. <b>Микроглия</b> — глиальные макрофаги.",
   "<b>Эпендимоциты</b> выстилают желудочки мозга и центральный канал; <b>таницитоны</b> с базальным отростком; в сосудистых сплетениях — секреция ликвора.",
   "<b>Астроциты</b>: <b>протоплазматические</b> (в сером веществе, короткие толстые отростки) и <b>волокнистые</b> (в белом веществе, длинные тонкие); маркер — <b>глиальный фибриллярный кислый белок</b>. Функции: опора, <b>гематоэнцефалический барьер</b> (ножки на капиллярах), обмен медиаторов, глиальные рубцы.",
   "<b>Олигодендроциты</b> — образуют <b>миелин в ЦНС</b>; один олигодендроцит миелинизирует несколько аксонов. На периферии: <b>шванновские клетки</b> (нейролеммоциты), <b>мантийные (сателлитные)</b> глиоциты вокруг тел нейронов в ганглиях.",
   "<b>Микроглия</b> — из промоноцитов: амебоидная (развивающийся мозг), покоящаяся (ветвистая), реактивная — фагоцитоз."],
   memo:"Эпендима — выстилка; астроцит — опора и ГЭБ; олигодендроцит — миелин в ЦНС; шванновская клетка — миелин на периферии; микроглия — макрофаг."},
  {h:"Нервные волокна", p:[
   "Волокно = <b>осевой цилиндр</b> (отросток нейрона) + <b>глиальная оболочка</b>.",
   "<b>Безмиелиновые</b> — в одной шванновской клетке несколько осевых цилиндров («<b>кабельный</b> тип»); <b>мезаксон</b> — сдвоенная мембрана, на которой подвешен цилиндр. Скорость 1–2 м/с; вегетативная НС.",
   "<b>Миелиновые</b> — один осевой цилиндр; <b>миелин</b> = спирально закрученный мезаксон (≈80% липидов), окраска <b>осмием</b> (чёрный). Снаружи — <b>нейролемма</b> (цитоплазма и ядро шванновской клетки) и базальная мембрана.",
   "<b>Перехваты Ранвье</b> — участки без миелина между шванновскими клетками; там Na⁺-каналы → <b>сальтаторное</b> (скачкообразное) проведение 5–120 м/с. <b>Насечки</b> (Шмидта–Лантермана) — прослойки цитоплазмы в миелине.",
   "<b>Регенерация</b>: дистальный отрезок — <b>валлеровская дегенерация</b>; шванновские клетки образуют <b>ленты Бюнгнера</b>; аксон растёт <b>3–4 мм/сут</b>; тело нейрона восстанавливается за 1–1,5 месяца."],
   memo:"Безмиелиновое — «кабель» (много цилиндров, медленно). Миелиновое — перехваты Ранвье, сальтаторно и быстро. Регенерация 3–4 мм/сут."}
 ],

{
 id:"t13", mod:"C", icon:"⚡", title:"13. Нервные окончания и синапсы",
 summary:[
  {h:"Классификация рецепторов", p:[
   "По источнику сигнала: <b>экстерорецепторы</b> и <b>интерорецепторы</b>.",
   "По природе стимула: ноци- (болевые), механо-, баро-, хемо-, термо-, <b>проприорецепторы</b>.",
   "По строению: <b>свободные</b> (ветвления осевого цилиндра без глии — в эпителии, болевые и температурные) и <b>несвободные</b>: <b>неинкапсулированные</b> (с глиальными клетками) и <b>инкапсулированные</b> (с соединительнотканной капсулой)."],
   memo:"Свободные — голые веточки в эпителии (боль, температура). Инкапсулированные — с капсулой (давление, вибрация)."},
  {h:"Рецепторы кожи и внутренних органов", p:[
   "В эпидермисе: <b>свободные окончания</b>; <b>осязательные диски Меркеля</b> (клетка Меркеля + терминаль — давление).",
   "<b>Пластинчатые тельца (Фатер–Пачини)</b> — крупные, в глубоких слоях дермы, в брыжейке, внутренних органах: <b>внутренняя колба</b> (глиоциты) + наружная колба из концентрических пластин → <b>давление и вибрация</b>.",
   "<b>Осязательные тельца Мейсснера</b> — в сосочковом слое дермы (кончики пальцев): осевой цилиндр извивается между уплощёнными глиоцитами → <b>прикосновение</b>.",
   "<b>Колбы Краузе</b> (холод), <b>тельца Руффини</b> (тепло, растяжение), генитальные тельца."],
   memo:"Пачини — «луковица», давление/вибрация глубоко. Мейсснер — в сосочках, касание."},
  {h:"Проприоцепторы", p:[
   "<b>Нервно-мышечное веретено</b> — в скелетных мышцах: капсула + <b>интрафузальные</b> мышечные волокна (с ядерной сумкой и ядерной цепочкой); на них чувствительные <b>аннулоспиральные</b> (первичные) и гроздевидные (вторичные) окончания; эфферентная γ-иннервация.",
   "Волокна с ядерной сумкой — <b>динамическое</b> растяжение (скорость); с ядерной цепочкой — <b>статическое</b> (степень).",
   "<b>Нервно-сухожильное веретено (Гольджи)</b> — на границе мышцы и сухожилия: реагирует на <b>натяжение</b> сухожилия при сокращении мышцы.",
   "Экстрафузальные волокна — обычные рабочие волокна мышцы."],
   memo:"Мышечное веретено — растяжение мышцы (интрафузальные волокна). Сухожильный орган Гольджи — натяжение сухожилия."},
  {h:"Строение синапса", p:[
   "<b>Пресинаптическая часть</b> — терминаль с <b>синаптическими пузырьками</b> (медиатор) и митохондриями; <b>пресинаптическая мембрана</b>.",
   "<b>Синаптическая щель</b> — 20–30 нм.",
   "<b>Постсинаптическая мембрана</b> с рецепторами; <b>постсинаптическое уплотнение</b>.",
   "Механизм: импульс → вход Ca²⁺ → <b>экзоцитоз</b> медиатора → связывание с рецепторами → <b>ионотропный</b> (канал) или <b>метаботропный</b> (через G-белки) эффект.",
   "Инактивация медиатора: ферменты (ацетилхолинэстераза), обратный захват."],
   memo:"Пресинапс → щель 20–30 нм → постсинапс. Ca²⁺ запускает выброс медиатора."},
  {h:"Виды синапсов", p:[
   "По месту контакта: <b>аксодендритические</b>, <b>аксосоматические</b>, <b>аксоаксональные</b>, дендродендритические.",
   "По способу передачи: <b>химические</b> и <b>электрические</b> (нексусы).",
   "По эффекту: <b>возбуждающие</b> (глутамат, ацетилхолин) и <b>тормозные</b> (<b>ГАМК</b>, глицин).",
   "Медиаторы: ацетилхолин (холинергические), норадреналин (адренергические), дофамин, серотонин, глутамат, ГАМК, нейропептиды."],
   memo:"ГАМК и глицин тормозят, глутамат возбуждает."},
  {h:"Нейроэффекторные окончания", p:[
   "<b>Нервно-мышечный синапс (моторная бляшка)</b> на скелетном волокне: терминаль аксона мотонейрона, щель, <b>подошва</b> (саркоплазма с ядрами) с <b>вторичными синаптическими щелями</b> (складками). Медиатор — <b>ацетилхолин</b> (Н-холинорецепторы).",
   "На гладких миоцитах и железах — <b>варикозные расширения</b> вегетативных аксонов; медиатор выделяется диффузно.",
   "<b>Секреторные</b> окончания — на железистых клетках."],
   memo:"Моторная бляшка: ацетилхолин + складки постсинаптической мембраны."}

{
 id:"t14", mod:"C", icon:"🦴", title:"14. Нервы, ганглии, спинной мозг",
 summary:[
  {h:"Подразделения нервной системы", p:[
   "Анатомически: <b>центральная</b> (головной и спинной мозг) и <b>периферическая</b> (нервы, ганглии, окончания).",
   "Функционально: <b>соматическая</b> (иннервация скелетных мышц, произвольная) и <b>вегетативная</b> (внутренние органы, сосуды, железы).",
   "Вегетативная: <b>симпатическая</b>, <b>парасимпатическая</b>, <b>метасимпатическая</b> (интрамуральные сплетения органов).",
   "<b>Соматическая рефлекторная дуга</b>: рецептор → чувствительный нейрон (спинномозговой ганглий) → (ассоциативный нейрон) → мотонейрон переднего рога → скелетная мышца."],
   memo:"ЦНС + ПНС; соматика (мышцы) + вегетатика (органы): симпатика, парасимпатика, метасимпатика."},
  {h:"Вегетативные рефлекторные дуги", p:[
   "Эфферентное звено <b>двухнейронное</b>: преганглионарный нейрон (в ЦНС) → постганглионарный (в ганглии).",
   "<b>Симпатическая</b>: центр — <b>боковые рога</b> грудных и верхнепоясничных сегментов (Th1–L2/3); ганглии — пара- и превертебральные; преганглионарные волокна короткие, постганглионарные длинные; медиатор на органе — <b>норадреналин</b>.",
   "<b>Парасимпатическая</b>: центры — ствол мозга (ядра III, VII, IX, X пар) и крестцовые сегменты; ганглии — <b>около или в стенке органа</b> (интрамуральные); преганглионарные волокна длинные; медиатор — <b>ацетилхолин</b>.",
   "<b>Метасимпатическая</b> — местные дуги в интрамуральных ганглиях (клетки Догеля I и II типа)."],
   memo:"Симпатика — боковые рога Th–L, ганглии у позвоночника, норадреналин. Парасимпатика — ствол и крестец, ганглии у органа, ацетилхолин."},
  {h:"Нервные стволы и ганглии", p:[
   "Оболочки нерва: <b>эндоневрий</b> (вокруг волокна), <b>периневрий</b> (вокруг пучка; плоские эпителиоподобные клетки — периневральный барьер), <b>эпиневрий</b> (вокруг всего нерва).",
   "<b>Спинномозговой (чувствительный) ганглий</b>: снаружи капсула; тела <b>псевдоуниполярных</b> нейронов лежат группами на периферии, окружены <b>мантийными глиоцитами</b> и капсулой; в центре — нервные волокна. <b>Синапсов нет</b>.",
   "<b>Симпатический ганглий</b>: <b>мультиполярные</b> нейроны разбросаны, есть <b>синапсы</b> (преганглионарные волокна на постганглионарных нейронах).",
   "<b>Интрамуральные ганглии</b> — в стенке органов (межмышечное и подслизистое сплетения): клетки Догеля I типа (эфферентные), II типа (чувствительные), III типа (ассоциативные)."],
   memo:"Эндо- → пери- → эпиневрий. В спинномозговом ганглии синапсов нет, в вегетативном — есть."},
  {h:"Спинной мозг: общий план", p:[
   "<b>Серое вещество</b> — в центре (форма бабочки, «буква Н»): <b>задние, передние и боковые рога</b>, промежуточная зона, центральный канал (эпендима).",
   "<b>Белое вещество</b> — снаружи: <b>задние, боковые и передние канатики</b>; миелиновые волокна проводящих путей.",
   "Оболочки мозга: <b>твёрдая</b>, <b>паутинная</b>, <b>мягкая</b>; пространства: эпидуральное, субдуральное, <b>субарахноидальное</b> (ликвор).",
   "Развитие — из нервной трубки: эпендимный слой → эпендима, плащевой → серое вещество, краевая вуаль → белое вещество."],
   memo:"Серое — внутри (рога), белое — снаружи (канатики)."},
  {h:"Серое вещество спинного мозга", p:[
   "<b>Задние рога</b>: губчатый слой, <b>студенистое вещество</b>, <b>собственное ядро заднего рога</b> (аксоны переходят на противоположную сторону в боковой канатик); в основании — <b>грудное ядро (Кларка)</b> (аксоны идут в боковой канатик своей стороны к мозжечку).",
   "<b>Промежуточная зона и боковые рога</b>: медиальное промежуточное ядро; <b>латеральное промежуточное ядро боковых рогов</b> — симпатические преганглионарные нейроны (Th1–L2).",
   "<b>Передние рога</b> — <b>мотонейроны</b> (крупные мультиполярные; α- и γ-), объединённые в медиальную и латеральную группы ядер; аксоны выходят в передние корешки к скелетным мышцам.",
   "Классификация нейронов по аксонам: <b>корешковые</b> (аксон уходит в корешок), <b>пучковые</b> (аксон идёт в белое вещество — проводящие пути), <b>внутренние</b> (аксон в пределах серого вещества)."],
   memo:"Задний рог — чувствительный «вход», передний — двигательный «выход», боковой — симпатика."},
  {h:"Белое вещество: проводящие пути", p:[
   "<b>Задние канатики</b> — восходящие пути проприоцептивной и тактильной чувствительности: <b>тонкий пучок (Голля)</b> и <b>клиновидный (Бурдаха)</b>.",
   "<b>Боковые канатики</b>: восходящие — спиноцеребеллярные (Флексига, Говерса), спиноталамический; нисходящие — <b>латеральный корково-спинномозговой (пирамидный)</b>, красноядерно-спинномозговой.",
   "<b>Передние канатики</b>: передний корково-спинномозговой путь, вестибуло- и ретикулоспинномозговые.",
   "Задний корешок — чувствительный (афферентный), передний — двигательный (эфферентный)."],
   memo:"Задние канатики — Голль и Бурдах (глубокая чувствительность). Пирамидный путь — в боковых канатиках."}
 ],

{
 id:"t16", mod:"C", icon:"👁️", title:"16. Органы зрения и обоняния",
 summary:[
  {h:"Строение глазного яблока", p:[
   "Оболочки: <b>фиброзная</b> (склера + роговица), <b>сосудистая</b> (собственно сосудистая + цилиарное тело + радужка), <b>внутренняя</b> (сетчатка).",

   "Аппараты: <b>диоптрический</b> (светопреломляющий: роговица, влага, хрусталик, стекловидное тело), <b>аккомодационный</b> (радужка, цилиарное тело, ресничный поясок), <b>рецепторный</b> (сетчатка).",
   "Развитие: сетчатка — из <b>глазного пузыря/бокала</b> (вырост промежуточного мозга); хрусталик и эпителий роговицы — из <b>кожной эктодермы</b>; сосудистая оболочка и склера — из мезенхимы."],
   memo:"Три оболочки: фиброзная — сосудистая — сетчатка. Сетчатка = мозг, хрусталик = кожа."},
  {h:"Фиброзная оболочка: роговица", p:[
   "<b>Склера</b> — плотная волокнистая ткань, белая, 0,3–0,6 мм. <b>Лимб</b> — граница склеры и роговицы; там <b>венозный синус склеры (шлеммов канал)</b> — отток водянистой влаги.",
   "<b>Роговица</b> — прозрачна, 0,9 мм, сосудов нет. 5 слоёв: <b>передний эпителий</b> (многослойный плоский неороговевающий), <b>передняя пограничная пластинка</b> (Боуменова), <b>собственное вещество</b> (пластины коллагена), <b>задняя пограничная пластинка</b> (Десцеметова), <b>задний эпителий</b> (эндотелий).",
   "Прозрачность — строго упорядоченные коллагеновые фибриллы, отсутствие сосудов, дегидратация (эндотелий откачивает воду)."],
   memo:"Роговица 5 слоёв: Эпителий — Боумен — Строма — Десцемет — Эндотелий."},
  {h:"Сосудистая оболочка, радужка, хрусталик", p:[
   "<b>Собственно сосудистая оболочка</b>: надсосудистая пластинка, сосудистая, сосудисто-капиллярная, <b>базальный комплекс (мембрана Бруха)</b>.",
   "<b>Цилиарное тело</b>: цилиарная мышца (гладкая) — <b>аккомодация</b>; цилиарные отростки — продукция <b>водянистой влаги</b>; к ним крепятся волокна ресничного пояска.",
   "<b>Радужка</b>: передний эпителий, наружный пограничный, сосудистый, внутренний пограничный слои, <b>пигментный эпителий</b>; мышцы — <b>сфинктер</b> (парасимпатика, сужает) и <b>дилататор</b> (симпатика, расширяет) зрачка — из <b>нейроэктодермы</b>. Цвет глаз — от количества меланоцитов.",
   "<b>Хрусталик</b>: капсула, <b>эпителий</b> (только на передней поверхности), <b>хрусталиковые волокна</b> (вытянутые клетки с белками кристаллинами, без ядер в центре)."],
   memo:"Цилиарная мышца — аккомодация, отростки — влага. Сфинктер — парасимпатика, дилататор — симпатика."},
  {h:"Сетчатка: 10 слоёв", p:[

   "6) <b>Внутренний ядерный</b> (биполярные, горизонтальные, амакринные клетки, глия Мюллера); 7) <b>внутренний сетчатый</b>; 8) <b>ганглионарный</b> (тела ганглионарных клеток); 9) <b>слой нервных волокон</b> (аксоны → зрительный нерв); 10) <b>внутренняя пограничная мембрана</b>.",
   "Нейронная цепь из трёх нейронов: <b>фоторецепторный → биполярный → ганглионарный</b>; горизонтальные и амакринные — ассоциативные.",
   "<b>Радиальные глиоциты (Мюллера)</b> пронизывают всю сетчатку, образуют пограничные мембраны."],
   memo:"Свет идёт насквозь к фоторецепторам, а сигнал — обратно: фоторецептор → биполяр → ганглионарная клетка → зрительный нерв."},
  {h:"Фоторецепторы и особые места", p:[
   "<b>Палочки</b> — сумеречное (чёрно-белое) зрение; пигмент <b>родопсин</b> (опсин + ретиналь — производное <b>витамина А</b>); наружный сегмент — стопка <b>дисков</b>, обновляются за <b>10 суток</b>.",

{
 id:"t17", mod:"C", icon:"👂", title:"17. Органы слуха, равновесия и вкуса",
 summary:[
  {h:"Составные части уха", p:[
   "<b>Наружное ухо</b> — ушная раковина (<b>эластический хрящ</b>), наружный слуховой проход (с серными железами), барабанная перепонка.",

   "<b>Внутреннее ухо</b> — <b>костный лабиринт</b> с <b>перепончатым лабиринтом</b> внутри. Между ними — <b>перилимфа</b>, внутри перепончатого — <b>эндолимфа</b> (много K⁺).",
   "Перепончатый лабиринт развивается из <b>слуховой плакоды</b> (эктодерма) → слуховой пузырёк."],

  {h:"Распределение рецепторных зон", p:[
   "<b>Улитка</b> (улитковый проток) — <b>спиральный (кортиев) орган</b>: слух.",
   "<b>Мешочки преддверия</b> (эллиптический и сферический) — <b>пятна (макулы)</b>: статическое равновесие, линейные ускорения, гравитация.",
   "<b>Полукружные каналы</b> (3) — <b>ампульные гребешки (кристы)</b>: угловые ускорения (вращение головы).",
   "Всего <b>6 рецепторных зон</b>: 1 спиральный орган + 2 пятна + 3 гребешка."],
   memo:"Улитка — звук; мешочки (пятна) — гравитация и линейное ускорение; каналы (гребешки) — вращение."},
  {h:"Улитка", p:[
   "Костная улитка — 2,5 оборота вокруг стержня (модиолуса); в стержне — <b>спиральный ганглий</b> (биполярные нейроны).",
   "Три канала: <b>лестница преддверия</b> (перилимфа), <b>улитковый проток</b> (эндолимфа), <b>барабанная лестница</b> (перилимфа).",
   "Стенки улиткового протока: верхняя — <b>вестибулярная (рейсснерова) мембрана</b>; наружная — <b>сосудистая полоска</b> (многорядный эпителий с капиллярами — продукция <b>эндолимфы</b>); нижняя — <b>базилярная мембрана</b> (струны) со <b>спиральным органом</b>.",
   "<b>Спиральная связка</b>, <b>лимб</b> с покровной (текториальной) мембраной."],
   memo:"Сверху — рейсснерова мембрана, снаружи — сосудистая полоска (эндолимфа), снизу — базилярная мембрана с кортиевым органом."},
  {h:"Спиральный (кортиев) орган", p:[
   "<b>Сенсорные (волосковые) клетки</b>: <b>внутренние</b> — один ряд, грушевидные; <b>наружные</b> — 3–5 рядов, цилиндрические. На апикальной поверхности — <b>стереоцилии</b> (волоски).",
   "<b>Поддерживающие клетки</b>: внутренние и наружные <b>клетки-столбы</b> (образуют внутренний туннель), фаланговые клетки (Дейтерса), клетки Гензена и др.",
   "Над волосками — <b>покровная (текториальная) мембрана</b>.",
   "Механизм: звук → колебания перилимфы → колебания базилярной мембраны → смещение стереоцилий относительно покровной мембраны → возбуждение волосковых клеток → дендриты нейронов спирального ганглия. Высокие звуки — у основания улитки, низкие — у верхушки.",
   "Волосковые клетки — <b>вторичночувствующие</b> рецепторы (не нейроны)."],
   memo:"Кортиев орган: волосковые клетки (1 ряд внутренних, 3–5 наружных) + клетки-столбы + покровная мембрана."},
  {h:"Вестибулярный отдел", p:[
   "<b>Пятна мешочков</b>: эпителий из <b>волосковых</b> (I типа — грушевидные, II типа — цилиндрические) и <b>поддерживающих</b> клеток; волоски — много <b>стереоцилий</b> и одна <b>киноцилия</b>.",
   "Сверху — <b>отолитовая мембрана</b> со <b>статоконием</b> (кристаллы карбоната кальция) — при наклоне головы смещается и сгибает волоски.",
   "<b>Ампульные гребешки</b> полукружных каналов покрыты <b>желатинозным куполом</b> (купулой) без отолитов; при вращении эндолимфа смещает купол.",
   "Аксоны — к вестибулярному ганглию."],
   memo:"Пятна — с отолитами (гравитация); гребешки — с куполом (вращение)."},
  {h:"Орган вкуса", p:[

   "Сенсорные клетки — <b>вторичночувствующие</b> (синапсы с дендритами чувствительных нейронов). Срок жизни клеток ≈<b>10 суток</b>.",

   "<b>Клапаны</b> — складки эндокарда, основа — плотная соединительная ткань; предсердная сторона гладкая, желудочковая — с сухожильными нитями.",

{
 id:"t20", mod:"D", icon:"🏭", title:"20. Кроветворение. Костный мозг и тимус",
 summary:[
  {h:"Этапы эмбрионального кроветворения", p:[
   "<b>Мезобластический</b> (с 3-й недели) — в стенке <b>желточного мешка</b> (кровяные островки): мегалобластический эритропоэз, внутрисосудистый.",
   "<b>Печёночный</b> (с 5–6-й недели, пик в 5 месяцев) — в печени: эритропоэз, гранулоцитопоэз, мегакариоцитопоэз (внесосудистый); также селезёнка и тимус.",
   "<b>Медуллярный</b> (костномозговой) — с 3-го месяца, основной к рождению.",
   "У взрослых: <b>центральные</b> органы — красный костный мозг (миелопоэз + начало лимфопоэза) и тимус (Т-лимфопоэз); <b>периферические</b> — лимфоузлы, селезёнка, лимфоидные образования слизистых.",
   "У детей красный костный мозг заполняет и диафизы; у взрослых — эпифизы трубчатых, плоские кости, тела позвонков."],
   memo:"Желточный мешок → печень → костный мозг."},
  {h:"Схема кроветворения: классы клеток", p:[
   "<b>Класс I</b> — <b>стволовые кроветворные клетки</b> (СКК): плюрипотентные, делятся редко (раз в 10–50 суток), самоподдержание; морфологически похожи на малые лимфоциты.",
   "<b>Класс II</b> — <b>полустволовые</b>: предшественник миелопоэза (КОЕ-ГЭММ) и предшественник лимфопоэза.",
   "<b>Класс III</b> — <b>унипотентные</b> (КОЕ-Э, КОЕ-Г, КОЕ-М, КОЕ-Мгкц, пре-В, пре-Т); чувствительны к поэтинам (эритропоэтин и др.).",
   "<b>Класс IV</b> — <b>бласты</b> (эритробласт, миелобласт, монобласт, мегакариобласт, лимфобласт) — первые морфологически распознаваемые.",
   "<b>Класс V</b> — <b>созревающие</b> клетки; <b>класс VI</b> — <b>зрелые</b> форменные элементы.",
   "Типы кроветворения: <b>гомобластический</b> (норма) и <b>гетеробластический</b> (при кровопотере — сдвиг к ранним формам)."],
   memo:"I стволовые → II полустволовые → III унипотентные → IV бласты → V созревающие → VI зрелые. Классы I–III морфологически не различимы."},
  {h:"Эритропоэз и гранулоцитопоэз", p:[
   "<b>Эритропоэз</b>: эритробласт → <b>пронормоцит</b> → нормоциты <b>базофильный</b> → <b>полихроматофильный</b> → <b>оксифильный</b> → (выталкивание ядра) → <b>ретикулоцит</b> → эритроцит. Накопление гемоглобина: базофилия → оксифилия.",
   "Эритропоэз идёт в <b>эритробластических островках</b> вокруг макрофага; регулятор — <b>эритропоэтин</b> (почки).",
   "<b>Гранулоцитопоэз</b>: миелобласт → <b>промиелоцит</b> (азурофильные гранулы) → <b>миелоцит</b> (специфические гранулы; последняя делящаяся стадия) → <b>метамиелоцит</b> (юный) → <b>палочкоядерный</b> → <b>сегментоядерный</b>.",
   "Моноцитопоэз: монобласт → промоноцит → моноцит. Мегакариоцитопоэз: мегакариобласт → промегакариоцит → <b>мегакариоцит</b> (полиплоидный, эндомитоз) → тромбоциты."],
   memo:"Эритроцит: бласт → пронормоцит → нормоциты (баз → полихр → окси) → ретикулоцит. Гранулоцит: бласт → про → миело → метамиело → палочка → сегмент."},
  {h:"Лимфопоэз: антигеннезависимая дифференцировка", p:[
   "В красном костном мозге созревают <b>В-лимфоциты</b>, в тимусе — <b>Т-лимфоциты</b>.",
   "<b>Реаранжировка генов</b> (V-D-J-рекомбинация) создаёт огромное разнообразие рецепторов.",
   "<b>Положительная селекция</b> — выживают клетки, способные распознавать собственные белки ГКГ; <b>отрицательная селекция</b> — гибнут клетки, реагирующие на собственные антигены (аутореактивные).",
   "В тимусе гибнет до <b>90%</b> созревающих Т-клеток; созревание длится ≈20 суток."],
   memo:"Положительная селекция — «видишь ГКГ? живи». Отрицательная — «бьёшь своих? умри»."},
  {h:"Красный костный мозг", p:[
   "Компоненты: <b>гемальный</b> (кроветворные клетки), <b>стромальный</b> (ретикулярная ткань, адипоциты, остеогенные клетки, макрофаги), <b>сосудистый</b> (синусоидные капилляры).",
   "Строма создаёт <b>кроветворное микроокружение</b>.",
   "Зрелые клетки выходят в кровь через стенку <b>синусов</b>.",
   "<b>Жёлтый костный мозг</b> — замещение жировой тканью (у взрослых в диафизах)."],
   memo:"Костный мозг = кроветворные клетки + ретикулярная строма + синусы."},
  {h:"Тимус", p:[
   "<b>Центральный орган</b> Т-лимфопоэза. Масса максимальна к <b>14–15 годам</b> (35–40 г); после 20 лет — <b>возрастная инволюция</b>; бывает <b>акцидентальная</b> инволюция при стрессе (глюкокортикоиды).",
   "Капсула и перегородки делят на <b>дольки</b>; в дольке — <b>корковое</b> (тёмное, много тимоцитов) и <b>мозговое</b> (светлое) вещество.",
   "Строма — <b>эпителиоретикулоциты</b> (эпителиального происхождения!): секретируют тимозин, тимопоэтин; в мозговом веществе образуют <b>тельца Гассаля</b> (слоистые тельца).",
   "Тимоциты: из костного мозга приходят пре-Т → в коре пролиферация, положительная селекция → в мозговом веществе отрицательная селекция → зрелые Т-клетки уходят.",
   "<b>Гематотимический барьер</b> в корковом веществе: эндотелий + базальные мембраны + эпителиоретикулоциты; есть макрофаги."],
   memo:"Тимус: строма эпителиальная, тельца Гассаля в мозговом веществе, барьер — в корковом. Пик к 14–15 годам."}

{
 id:"t21", mod:"D", icon:"🛡️", title:"21. Иммунитет. Лимфоузлы, селезёнка",
 summary:[
  {h:"Антигены и ГКГ", p:[
   "<b>Антиген</b> — вещество, вызывающее иммунный ответ; <b>антигенная детерминанта</b> (эпитоп) — участок, который распознаётся.",
   "<b>Главный комплекс гистосовместимости (ГКГ, HLA)</b>: <b>ГКГ I класса</b> — на всех ядерных клетках, представляют пептиды <b>цитотоксическим Т-клеткам (CD8)</b>; <b>ГКГ II класса</b> — на <b>антигенпредставляющих клетках</b> (дендритные, макрофаги, В-лимфоциты), представляют <b>Т-хелперам (CD4)</b>.",
   "Т-клетки распознают антиген только в комплексе с ГКГ (двойное распознавание)."],
   memo:"ГКГ I → CD8 (киллеры), ГКГ II → CD4 (хелперы). Правило «8 × 1 = 4 × 2 = 8»."},
  {h:"Иммунные реакции", p:[
   "<b>Инициация</b>: антигенпредставляющая клетка → Т-хелпер; хелперы бывают Th1 (клеточный ответ) и Th2 (гуморальный).",
   "<b>Клеточный</b> иммунитет: цитотоксические Т-лимфоциты (Т-киллеры) убивают заражённые и опухолевые клетки (перфорины, гранзимы).",
   "<b>Гуморальный</b>: В-лимфоцит + антиген + помощь Th2 → <b>бласттрансформация</b> → <b>плазмоциты</b> (живут 2–3 недели, не делятся) + <b>В-клетки памяти</b>.",
   "Классы иммуноглобулинов: <b>IgM</b> (первичный ответ, пентамер), <b>IgG</b> (≈70% Ig крови, вторичный ответ, проходит через плаценту), <b>IgA</b> (секреторный — на слизистых), <b>IgE</b> (аллергия, на тучных клетках и базофилах), IgD.",
   "Вторичный ответ (оптимально через 3–4 недели) быстрее и сильнее — благодаря клеткам памяти."],
   memo:"IgM — первый, IgG — главный (70%), IgA — слизистые, IgE — аллергия."},
  {h:"Лимфоузлы", p:[
   "Бобовидные, 0,5–1,5 см; капсула, трабекулы, <b>ретикулярная строма</b>. Приносящие лимфососуды — в капсулу, выносящие — из ворот.",
   "<b>Корковое вещество</b>: <b>лимфатические фолликулы</b> (<b>В-зона</b>): первичные (без центра) и вторичные — с <b>герминативным (светлым) центром</b> и мантией; там фолликулярные дендритные клетки.",
   "<b>Паракортикальная зона</b> (<b>Т-зона</b>) — между корой и мозговым веществом; <b>венулы с высоким эндотелием</b> (вход лимфоцитов из крови); интердигитирующие клетки.",
   "<b>Мозговое вещество</b>: <b>мозговые тяжи</b> (В-клетки, <b>плазмоциты</b>, макрофаги) и <b>мозговые синусы</b>.",
   "Синусы: краевой (подкапсульный) → промежуточные корковые → мозговые → воротный; фильтруют лимфу, очищая её от антигенов на 95–99%."],
   memo:"Лимфоузел: фолликулы = В-зона, паракортекс = Т-зона (венулы с высоким эндотелием), мозговые тяжи = плазмоциты."},
  {h:"Лимфоидная система слизистых (MALT)", p:[
   "Одиночные и <b>групповые лимфатические фолликулы</b> (<b>пейеровы бляшки</b> подвздошной кишки), <b>миндалины</b>, <b>червеобразный отросток</b>.",
   "<b>М-клетки</b> эпителия над фолликулами захватывают антигены из просвета и передают их иммунным клеткам.",
   "Основной продукт — <b>секреторный IgA</b>: плазмоциты собственной пластинки → эпителий (трансцитоз с секреторным компонентом) → просвет."],
   memo:"Пейеровы бляшки + М-клетки + секреторный IgA = иммунитет слизистых."},
  {h:"Селезёнка: строение", p:[
   "Функции: <b>иммунная</b> (ответ на антигены крови), <b>разрушение старых эритроцитов</b> и тромбоцитов, депо крови (≈0,5 л), у плода — кроветворение.",
   "Капсула и трабекулы — плотная соединительная ткань с <b>гладкими миоцитами</b>; строма — ретикулярная ткань.",
   "<b>Белая пульпа</b> — лимфоидная ткань вокруг артерий: <b>периартериальные лимфатические муфты</b> (<b>Т-зона</b>) и <b>лимфатические фолликулы</b> (В-зона) с <b>центральной артерией</b> (лежит эксцентрично); маргинальная зона.",
   "<b>Красная пульпа</b> (≈75–78%): <b>селезёночные (пульпарные) тяжи</b> (эритроциты, макрофаги, плазмоциты) и <b>венозные синусы</b> (эндотелий с щелями, решётчатая базальная мембрана)."],
   memo:"Белая пульпа — иммунитет (муфты = Т, фолликулы = В). Красная — фильтр крови (тяжи + синусы)."},
  {h:"Кровообращение селезёнки", p:[
   "Селезёночная артерия → <b>трабекулярные</b> артерии → <b>пульпарные</b> артерии → <b>центральные</b> артерии (в белой пульпе) → <b>кисточковые</b> артериолы → <b>эллипсоидные</b> (гильзовые) капилляры (с макрофагальной муфтой) → капилляры.",
   "<b>Закрытое</b> кровообращение — капилляры сразу впадают в синусы; <b>открытое</b> — кровь изливается в тяжи красной пульпы, затем проходит в синусы через щели — здесь макрофаги удаляют старые эритроциты.",
   "Синусы → пульпарные вены → трабекулярные вены → селезёночная вена."],
   memo:"Артерия: трабекулярная → пульпарная → центральная → кисточковые → гильзовые. Открытый путь = «экзамен» для эритроцитов."}
 ],

  {h:"Общий план пищеварительной трубки", p:[
   "Четыре оболочки: <b>слизистая</b> (эпителий + собственная пластинка + мышечная пластинка), <b>подслизистая основа</b>, <b>мышечная</b>, <b>наружная</b> (серозная или адвентициальная).",
   "Отделы: <b>передний</b> (ротовая полость, глотка, пищевод) — многослойный плоский эпителий; <b>средний</b> (желудок, кишки) — однослойный призматический; <b>задний</b> (анальный отдел прямой кишки).",
   "Иннервация: <b>подслизистое</b> (Мейсснера) и <b>межмышечное</b> (Ауэрбаха) нервные сплетения — метасимпатическая система.",
   "Источники: эпителий рта и анального отдела — <b>эктодерма</b>; эпителий среднего отдела и крупных желёз — <b>энтодерма</b>; соединительная ткань и гладкие мышцы — мезенхима."],
   memo:"Стенка трубки: слизистая — подслизистая — мышечная — наружная. Сплетения Мейсснера и Ауэрбаха."},
  {h:"Ротовая полость и язык", p:[
   "Слизистая рта — <b>многослойный плоский</b> эпителий: <b>ороговевающий</b> на дёснах и твёрдом нёбе (жевательная слизистая), <b>неороговевающий</b> — на щеках, дне полости рта (выстилающая).",
   "<b>Губа</b>: кожная часть, переходная (красная кайма — высокие сосочки, много капилляров), слизистая часть.",
   "<b>Язык</b>: основа — <b>поперечнополосатая мышечная ткань</b> (волокна в трёх направлениях); сосочки на верхней поверхности: <b>нитевидные</b> (самые многочисленные, ороговевают, без вкусовых почек), <b>грибовидные</b>, <b>листовидные</b>, <b>желобоватые</b> (8–12, окружены валиком; на боковых стенках — вкусовые почки; на дне желобка открываются протоки серозных желёз Эбнера).",
   "Корень языка — язычная миндалина."],
   memo:"Нитевидные — много и без вкуса; желобоватые — самые крупные, со вкусовыми почками в желобке."},
  {h:"Крупные слюнные железы", p:[
   "<b>Околоушная</b> — <b>белковая</b> (серозная); <b>подчелюстная</b> — смешанная (преобладают белковые отделы); <b>подъязычная</b> — смешанная (преобладают слизистые).",
   "Концевые отделы: <b>белковые</b> (сероциты — базофильные, зимогенные гранулы), <b>слизистые</b> (мукоциты — светлые, ядро уплощено у базальной мембраны), <b>смешанные</b> (слизистые клетки + <b>серозные полулуния</b> Джиануцци). Вокруг — <b>миоэпителиальные</b> клетки.",
   "Протоки: <b>вставочные</b> (кубический эпителий; длинные в околоушной), <b>исчерченные</b> (призматический эпителий с <b>базальной исчерченностью</b> — митохондрии; реабсорбция Na⁺; длинные в подчелюстной), междольковые, общий выводной.",
   "За сутки образуется ≈1,5 л слюны (99% вода); эндокринная функция — фактор роста нервов, эпидермальный фактор роста."],
   memo:"Околоушная — чистый белок, подъязычная — больше слизи, подчелюстная — посередине. Исчерченные протоки — «полоски» митохондрий."},
  {h:"Зуб: ткани", p:[
   "<b>Эмаль</b> — самая твёрдая ткань: неорганика 96–97% (гидроксиапатит), <b>эмалевые призмы</b>; бесклеточная (энамелобласты исчезают после прорезывания); толщина до 3–5 мм на верхушке. Источник — <b>эктодерма</b> (эмалевый орган).",
   "<b>Дентин</b> — неорганика ≈72%; пронизан <b>дентинными канальцами</b> с отростками <b>одонтобластов</b> (тела — на периферии пульпы); <b>предентин</b> — необызвествлённый внутренний слой; <b>интерглобулярные пространства</b>.",
   "<b>Цемент</b> — покрывает корень (≈1 мм), неорганика ≈70%; бесклеточный (вверху) и клеточный (с цементоцитами, внизу) — похож на грубоволокнистую кость.",
   "<b>Пульпа</b> — рыхлая соединительная ткань с сосудами и нервами; слои: периферический (одонтобласты), промежуточный, центральный.",
   "<b>Периодонт</b> — плотная соединительная ткань, крепит корень к альвеоле (шарпеевы волокна)."],
   memo:"Эмаль — 97% минералов, клеток нет (эктодерма). Дентин — канальцы с отростками одонтобластов. Цемент — как кость."},
  {h:"Развитие зубов", p:[
   "<b>Зубная пластинка</b> (эпителий ротовой полости, 6–7-я неделя) → <b>зубной зачаток</b>: <b>эмалевый орган</b> (эктодерма) + <b>зубной сосочек</b> (мезенхима → пульпа и одонтобласты) + <b>зубной мешочек</b> (мезенхима → цемент и периодонт).",
   "Стадии эмалевого органа: почка → колпачок → колокол. Слои: наружный и внутренний эмалевый эпителий (внутренний → <b>энамелобласты</b>), пульпа эмалевого органа.",
   "Гистогенез: сначала одонтобласты образуют <b>дентин</b>, затем энамелобласты — <b>эмаль</b>.",
   "Молочные зубы прорезываются с 6–8 мес до 2 лет; постоянные — с 6–7 до 18–30 лет."],
   memo:"Эмаль — от эмалевого органа (эктодерма); дентин и пульпа — от зубного сосочка (мезенхима); цемент — от мешочка."},
  {h:"Глотка и пищевод", p:[
   "<b>Глотка</b>: носовая часть — многорядный мерцательный эпителий; ротовая и гортанная — многослойный плоский неороговевающий; миндалины (лимфоэпителиальное глоточное кольцо).",
   "<b>Пищевод</b>: многослойный плоский <b>неороговевающий</b> эпителий; собственная пластинка с <b>кардиальными железами</b> (у желудка и на уровне перстневидного хряща); мощная <b>мышечная пластинка</b> слизистой; в подслизистой — <b>собственные железы</b> пищевода (слизистые).",
   "Мышечная оболочка: верхняя треть — <b>поперечнополосатая</b>, средняя — смешанная, нижняя — <b>гладкая</b>.",
   "Наружная оболочка — адвентиция (в брюшной части — серозная). Слизистая образует продольные складки."],
   memo:"Пищевод: МПНЭ, железы в подслизистой (собственные) и в слизистой (кардиальные), мышцы сверху поперечнополосатые → снизу гладкие."}
 ],

{
 id:"t24", mod:"E", icon:"🍽️", title:"24. Желудок и тонкая кишка",
 summary:[
  {h:"Стенка желудка", p:[
   "Рельеф: <b>складки</b>, <b>желудочные поля</b> (1–10 мм), <b>желудочные ямки</b> (≈3 млн, d 0,2 мм); в дно ямок открываются железы.",
   "Эпителий — <b>однослойный призматический железистый</b>: все клетки выделяют <b>слизь</b> (мукоидный секрет) — защита от HCl и пепсина. Клетки поверхностного эпителия живут ≈4 суток.",
   "Собственная пластинка заполнена железами; <b>мышечная пластинка</b> из 3 слоёв.",
   "Мышечная оболочка — 3 слоя: <b>внутренний косой</b>, <b>средний циркулярный</b> (образует пилорический сфинктер), <b>наружный продольный</b>. Наружная оболочка — серозная.",
   "Толщина слизистой ≈1 мм; глубина ямок — около 25% толщины слизистой (в пилорической части в 2–3 раза глубже)."],
   memo:"Желудок: призматический железистый эпителий (слизь), ямки, 3 слоя мышц (косой — круговой — продольный)."},
  {h:"Собственные (фундальные) железы", p:[
   "<b>Простые неразветвлённые трубчатые</b>; части: перешеек, шейка, тело, дно. Находятся в <b>дне и теле</b> желудка.",
   "<b>Главные клетки</b> (дно и тело желёз) — базофильные, синтезируют <b>пепсиноген</b> (и химозин у детей).",
   "<b>Париетальные (обкладочные)</b> — крупные, <b>оксифильные</b>, лежат снаружи от главных; <b>внутриклеточные секреторные канальцы</b>, много митохондрий; секретируют <b>HCl</b> (H⁺ через протонную помпу) и <b>внутренний фактор Касла</b> (всасывание витамина B₁₂).",
   "<b>Слизистые (шеечные)</b> клетки — слизь; <b>камбиальные</b> (недифференцированные) — в шейке и перешейке.",
   "<b>Эндокринные</b>: ЕС-клетки (серотонин), ECL-клетки (гистамин), G-клетки (гастрин — больше в пилорусе), D-клетки (соматостатин)."],
   memo:"Главные — пепсиноген (базофилы), париетальные — HCl и фактор Касла (оксифилы, канальцы). Нет фактора Касла → B₁₂-анемия."},
  {h:"Кардиальный и пилорический отделы", p:[
   "<b>Кардиальные железы</b>: простые разветвлённые трубчатые, преимущественно <b>слизистые</b> клетки; ямки неглубокие.",
   "<b>Пилорические железы</b>: короткие, разветвлённые; клетки — <b>слизистые</b>; много <b>G-клеток</b> (гастрин); ямки глубокие (50–70% толщины слизистой); главных и париетальных клеток почти нет.",
   "Циркулярный мышечный слой утолщён — <b>пилорический сфинктер</b>."],
   memo:"Пилорус: глубокие ямки, слизистые железы, гастрин, сфинктер."},
  {h:"Тонкая кишка: стенка", p:[
   "Отделы: двенадцатиперстная (25–30 см), тощая, подвздошная.",
   "Рельеф: <b>циркулярные складки</b> (слизистая + подслизистая), <b>ворсинки</b> (выросты слизистой, 0,5–1 мм) и <b>крипты</b> (трубчатые углубления) — всё увеличивает площадь всасывания; плюс <b>микроворсинки</b>.",
   "Ворсинка: эпителий + рыхлая соединительная ткань с капиллярами, <b>центральным лимфатическим (млечным) капилляром</b> и гладкими миоцитами.",
   "Эпителий — <b>однослойный призматический каёмчатый</b>; обновляется за <b>5–6 суток</b> (камбий — в криптах).",
   "Мышечная оболочка — 2 слоя (внутренний циркулярный, наружный продольный)."],
   memo:"Складки + ворсинки + крипты + микроворсинки = огромная площадь всасывания."},
  {h:"Клетки эпителия ворсинок и крипт", p:[
   "<b>Столбчатые (каёмчатые) энтероциты</b> — щёточная каёмка из микроворсинок с гликокаликсом (<b>пристеночное пищеварение</b>, ферменты), всасывание; жиры → в энтероцитах ресинтез → <b>хиломикроны</b> → в млечный капилляр.",
   "<b>Бокаловидные клетки</b> — слизь; их число растёт к подвздошной кишке.",

{
 id:"t25", mod:"E", icon:"🫁", title:"25. Толстая кишка, печень, поджелудочная",
 summary:[
  {h:"Толстая кишка", p:[
   "<b>Ворсинок нет</b>; много глубоких <b>крипт</b>; циркулярные складки (полулунные).",
   "Эпителий: каёмчатые энтероциты (тонкая каёмка; всасывание воды), очень много <b>бокаловидных</b> клеток, эндокринные, камбиальные; обновление за 4–6 суток.",
   "Много <b>одиночных лимфоидных фолликулов</b>.",
   "Мышечная оболочка: внутренний циркулярный слой сплошной, наружный продольный собран в <b>3 ленты</b>; между ними — гаустры; жировые отростки серозы.",
   "<b>Червеобразный отросток</b>: крипты, но главная особенность — <b>множество лимфоидных фолликулов</b> в слизистой и подслизистой («кишечная миндалина»); мышечная пластинка слабая.",
   "<b>Прямая кишка</b>: тазовый отдел — как толстая кишка; анальный — столбчатая, промежуточная (многослойный плоский неороговевающий) и кожная зоны; сфинктеры."],
   memo:"Толстая кишка: крипты без ворсинок, море бокаловидных клеток, 3 продольные ленты. Аппендикс — «миндалина» с фолликулами."},
  {h:"Печень: функции и план строения", p:[
   "Функции: образование <b>желчи</b>; обмен белков (синтез альбуминов, фибриногена), углеводов (<b>гликоген</b>), липидов; <b>детоксикация</b> (гладкая ЭПС); депо витаминов (A, D, B₁₂), железа; у плода — <b>кроветворение</b>.",
   "Капсула (глиссонова), строма скудная; ≈500 тыс. <b>классических долек</b> — шести- или пятигранные призмы 1,5–2 мм.",
   "<b>Портальная триада</b> (по углам долек, в междольковой соединительной ткани): <b>междольковая артерия</b>, <b>междольковая вена</b>, <b>междольковый желчный проток</b> (кубический эпителий).",
   "Другие представления: <b>портальная долька</b> (треугольник с триадой в центре — по оттоку желчи) и <b>ацинус</b> (ромб; зоны по снабжению кислородом)."],
   memo:"Классическая долька — центральная вена в центре, триады по углам. Портальная — триада в центре. Ацинус — ромб."},
  {h:"Кровоток в печени", p:[
   "Приток: <b>воротная вена</b> (≈75%, от кишечника — питательные вещества) и <b>печёночная артерия</b> (кислород).",
   "Схема: долевые → сегментарные → <b>междольковые</b> → вокругдольковые сосуды → <b>синусоидные капилляры</b> дольки (смешанная кровь) → <b>центральная вена</b> → поддольковые (собирательные) вены → <b>печёночные вены</b> → нижняя полая вена.",
   "Желчь течёт в противоположном направлении: желчные капилляры → холангиолы (Геринга) → междольковые протоки.",
   "Центральная вена — вена <b>безмышечного</b> типа; поддольковые вены идут одиночно (без артерий)."],
   memo:"Кровь — от периферии дольки к центру, желчь — от центра к периферии."},
  {h:"Гепатоциты и синусоиды", p:[
   "<b>Печёночные балки</b> — тяжи из двух рядов <b>гепатоцитов</b>, радиально к центральной вене; между гепатоцитами внутри балки — <b>желчный капилляр</b> (без собственной стенки — образован мембранами гепатоцитов с плотными контактами).",
   "Гепатоциты — ≈60% клеток печени; много двуядерных (до 20%) и полиплоидных; поверхности: <b>васкулярная</b> (к синусоиду, микроворсинки), <b>билиарная</b> (к желчному капилляру), контактная.",
   "<b>Синусоидные капилляры</b>: эндотелий с порами, <b>нет базальной мембраны</b>; в стенке — <b>звёздчатые макрофаги (клетки Купфера)</b> (≈40% клеток стенки).",
   "<b>Перисинусоидальное пространство (Диссе)</b> — между эндотелием и гепатоцитами; там — <b>жиронакапливающие клетки (Ито)</b> (запас <b>витамина А</b>; при циррозе → фибробласты) и <b>pit-клетки</b> (NK-клетки)."],
   memo:"Балка = 2 ряда гепатоцитов + желчный капилляр между ними. Синусоид: Купфер (макрофаг), Диссе (щель), Ито (витамин А), pit (NK)."},
  {h:"Желчные пути и желчный пузырь", p:[
   "Внутрипечёночные: желчные капилляры → холангиолы → междольковые протоки (кубический эпителий) → долевые.",
   "Внепечёночные: печёночные, пузырный, общий желчный проток (длина ≈7 см) — однослойный призматический эпителий.",
   "<b>Желчный пузырь</b> (40–70 мл): слизистая с <b>однослойным призматическим каёмчатым</b> эпителием (концентрирует желчь — всасывает воду), складки; мышечная оболочка; серозная/адвентициальная.",
   "Развитие печени — из <b>энтодермы</b> (печёночная бухта), строма — из мезенхимы."],
   memo:"Желчный пузырь концентрирует желчь: каёмчатый эпителий всасывает воду."},
  {h:"Поджелудочная железа", p:[
   "<b>Экзокринная часть</b> (≈97% массы): сложная альвеолярно-трубчатая; концевые отделы — <b>ацинусы</b> из <b>ацинозных клеток (панкреатоцитов)</b>: базальная часть — <b>гомогенная</b> базофильная (гр. ЭПС), апикальная — <b>зимогенная</b> оксифильная (гранулы проферментов: трипсиноген, липаза, амилаза).",
   "В центре ацинуса — <b>центроацинозные клетки</b> (начало вставочного протока). Протоки: вставочные → внутридольковые → междольковые → общий. <b>Исчерченных протоков нет</b> (в отличие от слюнных желёз).",
   "<b>Эндокринная часть</b> (≈3%): <b>островки Лангерганса</b> (0,1–0,3 мм, 1–2 млн); клетки: <b>B (β)</b> — базофильные, преобладают, лежат в <b>центре</b> островка — <b>инсулин</b> (↓глюкоза); <b>A (α)</b> — ацидофильные, на <b>периферии</b> — <b>глюкагон</b> (↑глюкоза); <b>D (δ)</b> — соматостатин; <b>PP</b> — панкреатический полипептид; D1 — ВИП.",
   "Островки светлее ацинусов на препарате; много фенестрированных капилляров."],
   memo:"Ацинус: низ гомогенный (базофил), верх зимогенный (оксифил). В-клетки — инсулин (большинство), А — глюкагон, D — соматостатин."}
 ],

{
 id:"t26", mod:"E", icon:"🌬️", title:"26. Органы дыхания",
 summary:[
  {h:"Компоненты и функции", p:[
   "<b>Воздухоносные пути</b>: носовая полость, носоглотка, гортань, трахея, бронхи (внелёгочные и внутрилёгочные) до терминальных бронхиол.",
   "<b>Респираторный отдел</b>: <b>ацинусы</b> (респираторные бронхиолы, альвеолярные ходы, альвеолярные мешочки, альвеолы).",
   "Функции: газообмен, очищение, согревание и увлажнение воздуха, голосообразование, обоняние; недыхательные — иммунная, метаболическая (ангиотензинпревращающий фермент), депо крови.",
   "Кровоснабжение: <b>функциональное</b> (лёгочная артерия → капилляры альвеол → лёгочные вены) и <b>трофическое</b> (бронхиальные артерии).",
   "Развитие: эпителий — из <b>энтодермы</b> (вентральный вырост передней кишки); хрящи, мышцы, соединительная ткань — из мезенхимы."],
   memo:"Воздухоносные пути — проведение, ацинусы — газообмен. Эпителий — энтодерма."},
  {h:"Носовая полость и гортань", p:[
   "<b>Преддверие</b> — многослойный плоский ороговевающий эпителий, волосы, сальные железы.",
   "<b>Дыхательная область</b> — многорядный мерцательный эпителий, слизистые железы, <b>венозные сплетения</b> (согревание).",
   "<b>Обонятельная область</b> — обонятельный эпителий (тема 16).",
   "<b>Гортань</b>: слизистая — многорядный мерцательный эпителий; на <b>истинных голосовых складках</b> и надгортаннике — многослойный плоский неороговевающий. Хрящи: гиалиновые (щитовидный, перстневидный, большая часть черпаловидных) и <b>эластические</b> (надгортанник, рожковидные, клиновидные). В голосовых складках — голосовая мышца (поперечнополосатая)."],
   memo:"Голосовые складки — многослойный плоский эпителий (трение); надгортанник — эластический хрящ."},
  {h:"Трахея и бронхи", p:[
   "Трахея: <b>слизистая</b> (многорядный мерцательный эпителий + собственная пластинка, <b>мышечной пластинки нет</b>), <b>подслизистая</b> (белково-слизистые железы), <b>фиброзно-хрящевая</b> (16–20 гиалиновых <b>незамкнутых колец</b>; сзади — гладкая мышца), <b>адвентиция</b>.",
   "Клетки эпителия: <b>реснитчатые</b> (реснички 3–5 мкм), <b>бокаловидные</b>, <b>базальные</b> (камбий), вставочные, <b>эндокринные</b>, клетки Клара (в бронхиолах). Обновление за 50–100 суток.",
   "<b>Мукоцилиарный клиренс</b>: слизь улавливает частицы, реснички выносят её к глотке.",
   "Деление бронхиального дерева: главные → долевые → <b>сегментарные</b> (10 слева, 11 справа) → субсегментарные → мелкие → <b>терминальные бронхиолы</b> (0,5 мм)."],
   memo:"Трахея: незамкнутые хрящевые кольца, мышечной пластинки слизистой нет. Мукоцилиарный эскалатор."},
  {h:"Изменения по ходу бронхиального дерева", p:[
   "По мере уменьшения калибра: эпителий становится ниже (многорядный → двухрядный → однослойный кубический), <b>бокаловидных клеток меньше</b>, хрящ — от колец к пластинам и островкам, затем <b>исчезает</b> в мелких бронхах; <b>мышечная пластинка</b> слизистой утолщается; железы исчезают.",
   "<b>Крупные бронхи</b>: многорядный эпителий, хрящевые пластины, железы, мышечная пластинка.",
   "<b>Средние</b>: островки хряща (могут быть эластическими).",
   "<b>Мелкие</b> (1–2 мм): нет хряща и желёз; мощная мышечная пластинка (при спазме — бронхиальная астма).",
   "<b>Терминальные бронхиолы</b>: однослойный кубический реснитчатый эпителий, <b>клетки Клара</b> (секреторные, компонент сурфактанта, детоксикация)."],
   memo:"Чем мельче бронх: эпителий ниже, хряща и желёз меньше, мышц больше."},
  {h:"Респираторный отдел: ацинус", p:[
   "<b>Ацинус</b> — структурно-функциональная единица: <b>респираторные бронхиолы</b> I–III порядка (с альвеолами в стенке) → <b>альвеолярные ходы</b> → <b>альвеолярные мешочки</b>.",
   "В лёгких ≈150 тыс. ацинусов, 250–350 млн альвеол.",
   "Альвеолы разделены <b>межальвеолярными перегородками</b> с капиллярами и эластическими волокнами; <b>поры Кона</b> соединяют соседние альвеолы.",
   "<b>Аэрогематический барьер</b> (≈0,5 мкм): <b>альвеолоцит I типа</b> + общая (слившаяся) <b>базальная мембрана</b> + <b>эндотелий</b> капилляра; плюс слой сурфактанта."],
   memo:"Ацинус: респираторные бронхиолы → ходы → мешочки. Барьер: альвеолоцит I + базальная мембрана + эндотелий."},
  {h:"Альвеолоциты и сурфактант", p:[
   "<b>Альвеолоциты I типа (респираторные)</b> — плоские, покрывают ≈<b>95%</b> поверхности альвеол; газообмен.",
   "<b>Альвеолоциты II типа (секреторные)</b> — крупные кубические, <b>осмиофильные пластинчатые тельца</b>; синтез <b>сурфактанта</b>; камбий для I типа; ≈5% поверхности.",
   "<b>Сурфактант</b>: ≈90% липиды (фосфолипиды — дипальмитоилфосфатидилхолин), ≈10% белки; снижает поверхностное натяжение — <b>альвеолы не спадаются</b> на выдохе; бактерицидный. Недостаток у недоношенных — <b>респираторный дистресс-синдром</b>.",
   "<b>Альвеолярные макрофаги</b> («пылевые клетки») — фагоцитоз частиц и бактерий на поверхности альвеол."],
   memo:"I тип — дышит (95% поверхности), II тип — делает сурфактант (пластинчатые тельца), макрофаг — убирает пыль."}
 ],
