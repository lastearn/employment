{
 id:"t27", mod:"E", icon:"🖐️", title:"27. Кожа и её производные",
 summary:[
  {h:"Общие сведения", p:[
   "Кожа = <b>эпидермис</b> (многослойный плоский ороговевающий эпителий; из эктодермы) + <b>дерма</b> (соединительная ткань; из дерматомов) + <b>гиподерма</b> (подкожная жировая клетчатка).",
   "Площадь 1,5–2,5 м², толщина в среднем 2 мм (0,5–5 мм).",
   "Функции: защитная (барьер), <b>терморегуляция</b> (≈80% теплоотдачи), выделительная (пот ≈500 мл/сут), рецепторная, синтез <b>витамина D</b>, депо крови (до 1 л), иммунная.",
   "<b>Толстая кожа</b> (ладони, подошвы): толстый эпидермис с <b>блестящим слоем</b>, нет волос и сальных желёз. <b>Тонкая кожа</b> — остальная поверхность: есть волосы."],
   memo:"Толстая кожа — ладони и подошвы: блестящий слой есть, волос нет."},
  {h:"Клетки эпидермиса", p:[
   "<b>Кератиноциты</b> — ≥85% клеток; образуют рогового слой.",
   "<b>Меланоциты</b> — в базальном слое (10–25% его клеток), из <b>нервного гребня</b>; отростчатые; синтезируют <b>меланин</b> в меланосомах (тирозиназа) и передают его кератиноцитам. Цвет кожи зависит от активности, а не числа меланоцитов.",
   "<b>Клетки Лангерганса</b> — внутриэпидермальные макрофаги (из моноцитов): захват и <b>презентация антигенов</b>; гранулы Бирбека. <b>Клетки Гринстейна</b> — участвуют в подавлении иммунных реакций.",
   "<b>Клетки Меркеля</b> — осязательные, в базальном слое, контактируют с нервной терминалью."],
   memo:"Кератиноциты — строят; меланоциты — красят (нервный гребень); Лангерганс — иммунный «часовой»; Меркель — осязание."},
  {h:"Кератинизация: слои эпидермиса", p:[
   "<b>Базальный</b> — кубические кератиноциты на базальной мембране (полудесмосомы); <b>стволовые</b> и переходные клетки делятся.",
   "<b>Шиповатый</b> — полигональные клетки с «шипами» (<b>десмосомы</b>), тонофибриллы; кератиносомы.",
   "<b>Зернистый</b> — уплощённые клетки с гранулами <b>кератогиалина</b> (филаггрин); ламеллярные гранулы выбрасывают липиды в межклеточное пространство (водный барьер).",
   "<b>Блестящий</b> (только в толстой коже) — гомогенный, <b>элеидин</b>; клетки без ядер.",
   "<b>Роговой</b> — <b>роговые чешуйки</b> (корнеоциты): кератин + утолщённая оболочка (инволюкрин, лорикрин); слущиваются.",
   "Полное обновление эпидермиса — ≈<b>40 суток</b> (26–42 суток по разным участкам)."],
   memo:"Кератин копится: базальный (делится) → шиповатый (шипы-десмосомы) → зернистый (кератогиалин) → блестящий (элеидин) → роговой (чешуйки)."},
  {h:"Дерма и сосуды кожи", p:[
   "<b>Сосочковый слой</b> — <b>рыхлая</b> волокнистая соединительная ткань; сосочки вдаются в эпидермис; капиллярные петли, тельца Мейсснера.",
   "<b>Сетчатый слой</b> — <b>плотная неоформленная</b> соединительная ткань; потовые и сальные железы, корни волос.",
   "Сосуды: <b>глубокое</b> (на границе с гиподермой) и <b>поверхностное</b> (подсосочковое) артериальные сплетения; венозные сплетения; много <b>АВА</b> (терморегуляция).",
   "Иннервация: свободные окончания в эпидермисе, диски Меркеля, тельца Мейсснера (сосочки), Пачини (глубоко), Руффини."],
   memo:"Сосочковый слой — рыхлый, сетчатый — плотный неоформленный."},
  {h:"Железы кожи", p:[
   "<b>Потовые</b> — <b>простые неразветвлённые трубчатые</b>; концевой отдел (клубочек) в глубокой дерме; ≈200 на 1 см².",
   "<b>Эккриновые (мерокриновые)</b> — по всей коже; секрет ≈98% вода; концевые отделы мелкие (30–35 мкм); миоэпителиальные клетки; проток — двухслойный кубический эпителий, открывается на поверхности кожи. ≈600–700 мл пота в сутки.",
   "<b>Апокриновые</b> — подмышки, промежность, вокруг ануса и сосков; начинают работать в пубертате; крупные концевые отделы (150–200 мкм); больше органики; открываются в <b>волосяную воронку</b>.",
   "<b>Сальные</b> — <b>простые разветвлённые альвеолярные</b>, <b>голокриновый</b> тип секреции; открываются в волосяную воронку; в концевом отделе — от базальных (камбиальных) клеток к центру клетки накапливают липиды и разрушаются. Нет на ладонях и подошвах."],
   memo:"Потовые — трубочки (мерокрин/апокрин), сальные — альвеолы (голокрин), обе апокриновые и сальные — в волосяную воронку."},
  {h:"Волосы и ногти", p:[
   "Волос: <b>стержень</b> (над кожей) и <b>корень</b> (в коже) с <b>луковицей</b>; в луковицу вдаётся <b>волосяной сосочек</b> (соединительная ткань с сосудами).",
   "Слои волоса: <b>мозговое вещество</b> (в толстых волосах), <b>корковое</b> (основная масса, твёрдый кератин, пигмент), <b>кутикула</b>.",
   "<b>Внутреннее эпителиальное влагалище</b> (кутикула влагалища, слои Хаксли и Генле), <b>наружное эпителиальное влагалище</b> (продолжение эпидермиса), <b>соединительнотканная сумка</b>. Мышца, поднимающая волос — <b>гладкая</b>.",
   "Цикл: <b>анаген</b> (рост, до 2–6 лет), <b>катаген</b> (2–4 недели), <b>телоген</b> (покой); скорость роста 0,3–0,4 мм/сут.",
   "<b>Ноготь</b>: ногтевая пластинка (роговые чешуйки, твёрдый кератин) на ногтевом ложе; рост из <b>матрикса</b> ногтя (под корнем, у лунки); ногтевые валики, эпонихий."],
   memo:"Волос растёт из луковицы, питается из сосочка. Цикл: анаген — катаген — телоген. Ноготь растёт из матрикса."}
 ],

{
 id:"t28", mod:"E", icon:"🫘", title:"28. Мочевая система",
 summary:[
  {h:"Почка: компоненты", p:[
   "<b>Корковое вещество</b> (почечные тельца, извитые канальцы; мозговые лучи) и <b>мозговое вещество</b> (пирамиды: прямые канальцы, петли, собирательные трубочки).",
   "<b>Нефрон</b> — структурно-функциональная единица (≈2 млн в обеих почках): <b>почечное тельце</b> (клубочек + капсула Шумлянского–Боумена) → <b>проксимальный каналец</b> (извитая и прямая части) → <b>тонкий каналец</b> (петля Генле) → <b>дистальный каналец</b> (прямая и извитая части) → вставочный отдел → собирательная трубочка (не входит в нефрон).",
   "Длина канальцевой части нефрона 5–5,5 см; проксимальный извитой каналец ≈2 см.",
   "<b>Типы нефронов</b>: короткие корковые (~1%), промежуточные корковые (≈80%), <b>юкстамедуллярные</b> (≈20%; длинная петля, глубоко в мозговое вещество)."],
   memo:"Нефрон: тельце → проксимальный → петля → дистальный. Собирательная трубочка в нефрон не входит."},
  {h:"Кровообращение в почке", p:[
   "<b>Кортикальная</b> система: почечная артерия → междолевые → <b>дуговые</b> → междольковые → <b>приносящая артериола</b> → <b>клубочек</b> (первичная капиллярная сеть, давление 50–60 мм рт. ст.) → <b>выносящая артериола</b> (уже приносящей) → <b>вторичная</b> перитубулярная сеть → вены.",
   "Это <b>«чудесная сеть»</b>: капилляры между двумя артериолами.",
   "<b>Юкстамедуллярная</b> система: выносящая артериола того же диаметра, отдаёт <b>прямые сосуды</b> в мозговое вещество (противоточный механизм); при сильной кровопотере — шунт (путь Труэты).",
   "Через почки проходит ≈1800 л крови в сутки."],
   memo:"Приносящая шире выносящей → высокое давление в клубочке → фильтрация."},
  {h:"Процессы образования мочи", p:[
   "<b>Фильтрация</b> в почечном тельце: ≈10% плазмы → <b>первичная моча</b> ≈<b>180 л/сут</b>.",
   "<b>Реабсорбция в проксимальном канальце</b> (облигатная): почти вся <b>глюкоза, белки, аминокислоты</b>, большая часть ионов и ≈85% воды.",
   "<b>Дистальные канальцы</b>: факультативная реабсорбция Na⁺ (под действием <b>альдостерона</b>).",
   "<b>Тонкие канальцы и собирательные трубочки</b>: реабсорбция воды под действием <b>вазопрессина (АДГ)</b>; противоточно-множительная система петли Генле.",
   "<b>Секреция</b> — выведение веществ из крови в просвет. Конечная моча ≈<b>1,5 л/сут</b> (>99% воды реабсорбируется)."],
   memo:"180 л первичной → 1,5 л конечной. Проксимальный — всё ценное; дистальный — Na⁺ (альдостерон); трубочки — вода (АДГ)."},
  {h:"Почечное тельце и фильтрационный барьер", p:[
   "Клубочек <b>фенестрированных капилляров</b> + <b>мезангий</b> (мезангиоциты — опора, фагоцитоз, сократимость) + капсула: <b>наружный листок</b> (однослойный плоский эпителий) и <b>внутренний листок</b> из <b>подоцитов</b>; между листками — полость капсулы.",
   "<b>Подоциты</b>: тело → крупные отростки (цитотрабекулы) → мелкие <b>ножки (цитоподии)</b>, между которыми <b>фильтрационные щели</b> с диафрагмами.",

{
 id:"t30", mod:"F", icon:"♀️", title:"30. Женская половая система",
 summary:[
  {h:"Яичник: общее строение", p:[
   "Снаружи — <b>однослойный кубический</b> (поверхностный) эпителий, под ним — <b>белочная оболочка</b>.",
   "<b>Корковое вещество</b> — фолликулы разных стадий, жёлтые и белые тела, атретические тела; строма — плотная соединительная ткань с веретеновидными клетками.",
   "<b>Мозговое вещество</b> — рыхлая соединительная ткань, сосуды, нервы; в воротах — хилусные клетки (андрогены).",
   "Отличия от яичка: мейоз начинается <b>до рождения</b> и растянут до 45–50 лет; из одного ооцита — <b>одна</b> яйцеклетка; запас половых клеток не пополняется."],
   memo:"Яичник: снаружи кора с фолликулами, внутри — мозговое вещество с сосудами."},
  {h:"Фолликулы", p:[
   "<b>Примордиальный</b> — ооцит I порядка (в <b>диплотене</b> профазы I) + 1 слой <b>плоских</b> фолликулярных клеток. Покоящиеся, самые многочисленные.",
   "<b>Первичный</b> — ооцит растёт, появляется <b>блестящая оболочка</b>; фолликулярные клетки кубические/призматические (1 слой → многослойный).",
   "<b>Вторичный</b> (преантральный/антральный) — многослойный <b>зернистый слой</b> (гранулёза), появляются полости с <b>фолликулярной жидкостью</b>; формируется <b>тека</b> (внутренняя — эндокринная, синтез андрогенов → эстрогены в гранулёзе; наружная — соединительнотканная).",
   "<b>Третичный (зрелый, граафов пузырёк)</b> — одна большая полость; ооцит в <b>яйценосном бугорке</b>; вокруг ооцита — <b>лучистый венец</b>.",
   "<b>Овуляция</b> (на 14-й день 28-дневного цикла, пик <b>ЛГ</b>): выход <b>ооцита II порядка</b> (в метафазе II) с лучистым венцом. Обычно созревает один фолликул за цикл; остальные подвергаются <b>атрезии</b> (→ атретические тела)."],
   memo:"Примордиальный (плоские клетки) → первичный (zona pellucida) → вторичный (полости, тека) → третичный (граафов) → овуляция."},
  {h:"Жёлтое тело", p:[
   "Образуется на месте лопнувшего фолликула под действием <b>ЛГ</b>.",
   "Стадии: <b>пролиферация и васкуляризация</b> → <b>железистый метаморфоз</b> (клетки гранулёзы → <b>лютеоциты</b> с липидами и лютеином) → <b>расцвет</b> (секреция <b>прогестерона</b>) → <b>обратное развитие</b>.",
   "<b>Менструальное</b> жёлтое тело (1,5–2 см) живёт 7–10 дней (расцвет); <b>жёлтое тело беременности</b> (до 5 см) поддерживается ХГ и функционирует несколько месяцев.",
   "После инволюции — <b>беловатое тело</b> (рубец)."],
   memo:"Жёлтое тело = прогестерон. Рассасывается в беловатое тело."},
  {h:"Оогенез и гормоны", p:[
   "<b>Размножение</b> оогоний — <b>внутриутробно</b> (до 5–10 млн; многие гибнут); <b>рост</b> — ооциты I порядка вступают в мейоз и останавливаются в <b>диплотене</b> (примордиальные фолликулы); к рождению — от 400 тыс. до 2 млн.",
   "<b>Созревание</b>: I деление мейоза завершается перед овуляцией (ооцит II + 1-е полярное тельце); II деление — только <b>после оплодотворения</b> (2-е полярное тельце). Формирования нет.",
   "<b>ФСГ</b> — рост фолликулов, эстрогены; <b>ЛГ</b> — овуляция и жёлтое тело.",
   "<b>Эстрогены</b> (гранулёза + тека) — пролиферация эндометрия, вторичные половые признаки. <b>Прогестерон</b> (жёлтое тело) — секреторная фаза эндометрия, подготовка к имплантации, сохранение беременности."],
   memo:"Мейоз ооцита: стоп в диплотене до пубертата → I деление перед овуляцией → II деление только после оплодотворения."},
  {h:"Маточные трубы, матка, влагалище", p:[
   "<b>Маточная труба</b> (10–12 см): слизистая с <b>разветвлёнными складками</b>; эпителий <b>однослойный призматический</b> из <b>реснитчатых</b> и <b>секреторных</b> клеток; мышечная оболочка, серозная. Место <b>оплодотворения</b> — ампула.",
   "<b>Матка</b>: <b>эндометрий</b> (однослойный призматический эпителий + собственная пластинка с <b>маточными железами</b>; <b>функциональный</b> слой — отторгается и <b>базальный</b> — регенерирует), <b>миометрий</b> (3 слоя гладких мышц: подслизистый, сосудистый, надсосудистый), <b>периметрий</b> (серозная оболочка).",
   "<b>Шейка матки</b>: цервикальный канал — однослойный призматический слизистый эпителий; влагалищная часть — <b>многослойный плоский неороговевающий</b>; граница — зона трансформации.",
   "<b>Влагалище</b> (8–10 см): многослойный плоский неороговевающий эпителий, богатый <b>гликогеном</b> (молочнокислые бактерии — кислая среда); <b>желёз нет</b>."],
   memo:"Эндометрий: функциональный слой уходит, базальный остаётся. Влагалище — без желёз, эпителий с гликогеном."},
  {h:"Молочная железа и цикл", p:[
   "<b>Молочная железа</b> — видоизменённая апокриновая потовая железа; сложная разветвлённая альвеолярная; ≈15–20 долей. Вне беременности — в основном протоки; при <b>лактации</b> — развитые альвеолы; секреция: белки — <b>мерокриновая</b>, липиды — <b>апокриновая</b>; миоэпителий (окситоцин); пролактин стимулирует синтез молока.",
   "<b>Овариально-менструальный цикл</b> (обычно 28 дней):",
   "<b>Менструальный период</b> (1–4/5 дни) — спазм спиральных артерий, отторжение функционального слоя.",
   "<b>Постменструальный (пролиферативный)</b> (5–14 дни) — под <b>эстрогенами</b> регенерация эндометрия из базального слоя; в яичнике — рост фолликула; на 14-й день — овуляция.",
   "<b>Предменструальный (секреторный)</b> (15–28 дни) — под <b>прогестероном</b> железы извитые, секретируют гликоген; отёк стромы, <b>децидуальные</b> клетки; в яичнике — жёлтое тело."],
   memo:"Цикл: менструация (отторжение) → пролиферация (эстрогены, фолликул) → овуляция → секреция (прогестерон, жёлтое тело)."}
 ],

{
 id:"t31", mod:"F", icon:"👶", title:"31. Ранние стадии развития человека",
 summary:[
  {h:"Половые клетки и периоды", p:[
   "Эякулят 2–3 мл, 200–350 млн сперматозоидов (50% с X, 50% с Y-хромосомой).",
   "Сперматозоиды сохраняют оплодотворяющую способность в половых путях женщины <b>1–2 суток</b>; ооцит II оптимально оплодотворяется в первые <b>24 ч</b> после овуляции.",
   "<b>Периоды</b> внутриутробного развития: <b>начальный</b> (1-я неделя), <b>зародышевый/эмбриональный</b> (до 8-й недели — закладка всех органов) и <b>плодный</b> (с 9-й недели до рождения).",
   "Первые 8 недель — самый <b>критический период</b> (чувствительность к тератогенам)."],
   memo:"Начальный (1 нед) → эмбриональный (до 8 нед) → плодный (9 нед — роды). Первые 8 недель — критические."},
  {h:"Оплодотворение у человека", p:[
   "Происходит в <b>ампуле маточной трубы</b>.",
   "Фазы: <b>дистантное</b> взаимодействие и <b>капацитация</b> (≈7 ч, в основном в матке) → <b>контактное</b> взаимодействие и <b>акросомная реакция</b> (до 12 ч) → <b>проникновение</b> → подготовка зиготы к дроблению (≈12 ч). Всего ≈30 ч.",
   "Проникновение сперматозоида завершает <b>второе деление мейоза</b> ооцита (выделяется 2-е полярное тельце); <b>кортикальная реакция</b> блокирует полиспермию.",
   "Пронуклеусы не сливаются: хромосомы объединяются уже в первом митозе (≈30 ч).",

   memo:"Капацитация 7 ч + акросомная реакция 12 ч + подготовка зиготы 12 ч ≈ 30 ч до первого деления."},
  {h:"Дробление и бластоциста", p:[
   "Дробление <b>полное, неравномерное, асинхронное</b>; идёт во время движения по маточной трубе.",
   "2 клетки — 30–32 ч; 4 клетки — 40 ч; 3 сутки — 12–16 клеток (<b>морула</b>); к концу 4-х суток — 32 бластомера; зародыш попадает в матку.",
   "Различаются <b>светлые</b> (наружные, мелкие) бластомеры → <b>трофобласт</b>, и <b>тёмные</b> (внутренние, крупные) → <b>эмбриобласт</b>.",
   "<b>Бластоциста</b> (4–5 сутки): трофобласт + эмбриобласт (внутренняя клеточная масса) + бластоцель; 5–6 сутки свободная бластоциста выходит из zona pellucida («вылупление»)."],
   memo:"Морула на 3-и сутки, бластоциста на 4–5-е, имплантация — на 7-е."},
  {h:"Имплантация", p:[
   "<b>Имплантация (нидация)</b> начинается на <b>7-е сутки</b> и длится ≈40 ч: 1) <b>адгезия</b> (прилипание к эндометрию); 2) <b>инвазия</b> (внедрение).",
   "Трофобласт делится на <b>цитотрофобласт</b> (клеточный, внутренний) и <b>симпластотрофобласт</b> (синцитиотрофобласт; наружный, многоядерный — ферменты разрушают эндометрий).",
   "Тип имплантации у человека — <b>интерстициальный</b> (зародыш полностью погружается в эндометрий).",
   "Трофобласт сразу начинает вырабатывать <b>хорионический гонадотропин (ХГ)</b> — основа теста на беременность; поддерживает жёлтое тело."],
   memo:"7-е сутки: адгезия → инвазия. Синцитиотрофобласт «прогрызает» эндометрий и делает ХГ."},
  {h:"Гаструляция и внезародышевые органы", p:[
   "<b>Первая фаза</b> гаструляции — <b>деламинация</b> на 7-е сутки: эмбриобласт → <b>эпибласт</b> и <b>гипобласт</b> (двухслойный зародышевый диск).",
   "<b>Амниотический пузырёк</b> (7-й день) — из эпибласта: крыша — амниотическая эктодерма, дно — зародышевый эпибласт. <b>Желточный пузырёк</b> — из гипобласта (внезародышевая энтодерма).",
   "<b>Внезародышевая мезодерма</b> → <b>хорион</b> (трофобласт + внезародышевая мезодерма; первичные → вторичные → третичные ворсины), <b>амниотическая ножка</b>.",
   "<b>Вторая фаза</b> — <b>иммиграция</b> (14–17-е сутки): клетки эпибласта мигрируют через <b>первичную полоску</b> и <b>первичный (гензеновский) узелок</b> → <b>энтодерма</b> и <b>мезодерма</b>; оставшиеся — <b>эктодерма</b>; из узелка — <b>хордальный отросток</b>.",
   "<b>Аллантоис</b> — на 3–4-й неделе, вырост энтодермы в амниотическую ножку."],
   memo:"7 сутки — деламинация (эпибласт/гипобласт); 14–17 сутки — иммиграция через первичную полоску (три листка)."},
  {h:"Органогенез: 3–8-я неделя", p:[
   "<b>3-я неделя</b>: хорда, <b>нервная пластинка</b> → нервная трубка; сомиты; кровяные островки в желточном мешке; закладка сердца.",
   "<b>Обособление тела</b> зародыша туловищной складкой; кишечная трубка; связь с желточным мешком — желточный стебелёк.",
   "<b>4-я неделя</b>: замыкание нервной трубки, 3 мозговых пузыря; <b>жаберные дуги</b>; сердце начинает сокращаться; зачатки конечностей; закладки печени, лёгких, поджелудочной железы.",
   "<b>5–6-я неделя</b>: 5 мозговых пузырей, развитие лица, конечностей, первичная почка; <b>7–8-я</b>: пальцы, окончательная почка, к концу 8-й недели все основные органы заложены — начинается плодный период."],
   memo:"3-я неделя — осевые органы; 4-я — сердце бьётся, жабры, конечности; 8-я — закладки всех систем."}

{
 id:"t32", mod:"F", icon:"🤰", title:"32. Оболочки плода и плацента",
 summary:[
  {h:"Децидуальная оболочка и хорион", p:[
   "<b>Децидуальная оболочка</b> (отпадающая) — функциональный слой эндометрия при беременности: <b>базальная</b> (decidua basalis — под зародышем, материнская часть плаценты), <b>сумочная</b> (capsularis — над зародышем), <b>пристеночная</b> (parietalis — остальная матка). С 4-го месяца сумочная сливается с пристеночной.",
   "<b>Децидуальные клетки</b> — крупные, богатые гликогеном и липидами; секретируют пролактин, простагландины.",
   "<b>Хорион</b>: <b>ветвистый</b> (frondosum) — у базальной децидуальной оболочки, с разветвлёнными ворсинами → <b>плодная часть плаценты</b>; <b>гладкий</b> (laeve) — ворсины исчезают.",
   "Ворсины: <b>первичные</b> (только трофобласт), <b>вторичные</b> (+ мезенхима), <b>третичные</b> (+ сосуды)."],
   memo:"Ворсины: первичные (трофобласт) → вторичные (+ мезенхима) → третичные (+ сосуды)."},
  {h:"Амнион и тканевой состав оболочек", p:[
   "<b>Амнион</b>: <b>амниотический эпителий</b> (однослойный; над плацентой — призматический, секретирует и всасывает околоплодные воды) + соединительнотканная часть (базальная мембрана, плотный и губчатый слои).",
   "Околоплодные воды — защита от механических воздействий, свободные движения плода, обмен.",
   "Оболочки плода снаружи внутрь: децидуальная (материнская) → хорион → амнион.",
   "Желточный мешок и аллантоис у человека редуцируются; их сосуды → пупочные."],
   memo:"Плодные оболочки: децидуа (мать) → хорион → амнион (плод)."},
  {h:"Плацента: тип и строение", p:[
   "Тип плаценты человека: <b>гемохориальная</b> (ворсины хориона омываются <b>материнской кровью</b> в лакунах), <b>дискоидальная</b>, ворсинчатая.",
   "<b>Плодная часть</b>: <b>хориальная пластинка</b> (амнион + соединительная ткань с пупочными сосудами) и отходящие от неё <b>ворсины</b>: <b>стволовые (якорные)</b> — крепятся к базальной оболочке; <b>свободные (концевые)</b> — плавают в лакунах. <b>Котиледон</b> — стволовая ворсина со всеми разветвлениями (10–20 больших долек).",

/* items with multiple groups */
function itemsOf(cls){
  const map={};
  for(const [g,arr] of Object.entries(cls.g)) for(const it of arr){ (map[it]=map[it]||[]).push(g); }
  return Object.entries(map).map(([name,groups])=>({name,groups}));
}

/* авто-вопросы из классификаций */
function autoQuestions(t){
  const qs=[];
  t.groups.forEach(cls=>{
    const groups=Object.keys(cls.g);
    if(groups.length<3) return;
    itemsOf(cls).forEach(it=>{
      const wrong=shuffle(groups.filter(g=>!it.groups.includes(g))).slice(0,3);
      if(wrong.length<2) return;
      const right=it.groups[0];
      qs.push({q:`«${esc(it.name)}» — к чему относится? <span class="sub">(${esc(cls.name)})</span>`,o:[right,...wrong],e:`${esc(it.name)}: ${esc(it.groups.join("; "))}.`});
    });
    groups.forEach(g=>{
      const inG=cls.g[g];
      const others=shuffle(itemsOf(cls).filter(it=>!it.groups.includes(g)).map(it=>it.name)).slice(0,3);
      if(others.length<3) return;
      const right=pick(inG,1)[0];
      qs.push({q:`Что относится к группе «${esc(g)}»? <span class="sub">(${esc(cls.name)})</span>`,o:[right,...others],e:`${esc(g)}: ${esc(inG.join(", "))}.`});
    });
  });
  return qs;
}

  if(!h){ return home(); }
  if(h==="exam") return quiz(null,null);
  if(h.startsWith("exam-")) return quiz(null,h.slice(5));
  if(h==="dict") return dictMode();
  if(h==="mistakes") return mistakesMode();
  const [tid,mode]=h.split("-");

  if(!t) return home();
  if(!mode) return topicHome(t);
  ({read:readMode,cards:cardsMode,quiz:()=>quiz(t),sort:sortMode,pairs:pairsMode,tf:tfMode}[mode]||topicHome)(t);
}

            <span class="sub">${topicPct(t)}% освоено</span>
            <div class="bar"><i style="width:${topicPct(t)}%"></i></div>
          </span>
        </button>`).join("")}
      <button class="btn ghost wide" style="margin-bottom:8px" onclick="go('exam-${m.id}')">🎯 Экзамен по модулю ${m.id}</button>
    </details>`).join("")}
  ${accHTML()}
  <div class="note">Совет: конспект → карточки → игры → тест. Ошибки из тестов попадают в «Работу над ошибками».${AUTH?"":" Прогресс сохраняется в этом браузере."}</div>`;
}
function contNext(){
  const t=TOPICS.find(t=>topicPct(t)<80)||TOPICS[0];
  go(t.id+(get(t.id,"read")?"":"-read"));
}

function topicHome(t){
  const m=[
   ["read","📖","Конспект","Главное из учебника с подсказками",get(t.id,"read")?"прочитано ✓":""],
   ["cards","🃏","Карточки","Термин → переверни → ответ",get(t.id,"cards")?`знаю ${get(t.id,"cards")}%`:""],
   ["sort","🗂️","Разложи по группам","Классификации и признаки",get(t.id,"sort")?`лучший ${get(t.id,"sort")}%`:""],
   ["pairs","🔗","Найди пару","Термин ↔ главный факт",get(t.id,"pairs")?`лучший ${get(t.id,"pairs")}%`:""],
   ["tf","⚡","Верно / неверно","Быстрые утверждения",get(t.id,"tf")?`лучший ${get(t.id,"tf")}%`:""],
   ["quiz","📝","Тест","15 вопросов с оценкой",get(t.id,"quiz")?`лучший ${get(t.id,"quiz")}%`:""]
  ];
  const i=TOPICS.indexOf(t), nx=TOPICS[i+1];
  app.innerHTML = header(`${t.icon} ${t.title}`,"") + `
   <div class="card"><div class="sub">Освоено темы</div><div style="font-size:28px;font-weight:800">${topicPct(t)}%</div><div class="bar"><i style="width:${topicPct(t)}%"></i></div></div>
   <div class="grid">${m.map(([k,e,n,d,b])=>`<button class="mode" onclick="go('${t.id}-${k}')"><span class="e">${e}</span><b>${n}</b><small>${d}</small><span class="best">${b}</span></button>`).join("")}</div>
   ${nx?`<button class="btn ghost wide" style="margin-top:12px" onclick="go('${nx.id}')">Следующая тема: ${nx.title} →</button>`:""}`;
}

/* --- Конспект --- */
function readMode(t){
  app.innerHTML = header("📖 Конспект",t.id) + `<div class="sub" style="margin-bottom:10px">${t.title}. Нажимай на блоки, чтобы раскрыть.</div>` +
   t.summary.map((s,i)=>`<details class="sec" ${i===0?"open":""}><summary>${i+1}. ${s.h}</summary><div class="in"><ul>${s.p.map(x=>`<li>${x}</li>`).join("")}</ul>${s.memo?`<div class="memo">${s.memo}</div>`:""}</div></details>`).join("") +
   `<button class="btn wide" onclick="rec('${t.id}','read',100);go('${t.id}-cards')">Прочитал → к карточкам</button>`;
}

/* --- Карточки --- */
function cardsMode(t){
  let queue=shuffle(t.cards.map((c,i)=>i)), known=new Set(), firstTry=new Set(t.cards.map((c,i)=>i)), flipped=false;
  function draw(){
    if(!queue.length){
      const pct=Math.round(known.size?([...known].filter(i=>firstTry.has(i)).length/t.cards.length*100):0);
      rec(t.id,"cards",pct);
      app.innerHTML=header("🃏 Карточки",t.id)+`<div class="card result"><div class="big">${pct}%</div><div>знал с первого раза</div><br><div class="row" style="justify-content:center"><button class="btn" onclick="route()">Ещё раз</button><button class="btn ghost" onclick="go('${t.id}-sort')">К игре →</button></div></div>`;
      return;
    }
    const i=queue[0], [q,a]=t.cards[i];
    app.innerHTML=header("🃏 Карточки",t.id)+`
     <div class="progress-line"><span>Осталось: ${queue.length}</span><span>Выучено: ${known.size}/${t.cards.length}</span></div>
     <div class="flip ${flipped?"on":""}" id="fl"><div class="inner">
       <div class="face"><div class="q">${q}</div><div class="hint">нажми, чтобы перевернуть</div></div>
       <div class="face back-f"><div class="a">${a}</div></div>
     </div></div>
     <div class="row"><button class="btn ghost" style="flex:1" id="no">🔁 Повторить</button><button class="btn" style="flex:1" id="yes">✅ Знаю</button></div>`;
    $("#fl").onclick=()=>{flipped=!flipped;$("#fl").classList.toggle("on")};
    $("#yes").onclick=()=>{known.add(i);queue.shift();flipped=false;draw();};
    $("#no").onclick=()=>{firstTry.delete(i);queue.push(queue.shift());flipped=false;draw();};
  }
  draw();
}

/* --- Тест / Экзамен / Ошибки --- */
function quiz(t, modId, custom){
  const isExam=!t;
  let pool;
  if(custom){ pool=custom; }
  else if(isExam){
    pool=[];
    const ts=modId?modTopics(modId):TOPICS;
    const per=modId?4:1, auto=modId?1:1;
    ts.forEach(tp=>{ pool.push(...pick(tp.quiz,per).map(q=>({...q,tid:tp.id})), ...pick(autoQuestions(tp),auto)); });
    pool=modId?shuffle(pool):pick(pool,40);
  } else {
    pool=shuffle([...pick(t.quiz,10).map(q=>({...q,tid:t.id})),...pick(autoQuestions(t),5)]);
  }
  pool=pool.map(q=>{const right=q.o[0];return {...q,opts:shuffle(q.o),right};});
  let i=0,score=0,answered=false;
  const title=custom?"🩹 Работа над ошибками":isExam?(modId?`🎯 Экзамен: модуль ${modId}`:"🎯 Итоговый экзамен"):"📝 Тест";
  const back=isExam||custom?"":t.id;
  function draw(){
    if(i>=pool.length){
      const pct=Math.round(score/pool.length*100);
      if(custom){ save(); }
      else if(isExam){ const k=modId?"exam"+modId:"exam"; STORE[k]=Math.max(STORE[k]||0,pct); save(); } else rec(t.id,"quiz",pct);
      const mark=pct>=90?"Отлично! 🔥":pct>=75?"Хорошо 👍":pct>=60?"Удовлетворительно":"Нужно повторить 📖";
      app.innerHTML=header(title,back)+`<div class="card result"><div class="big">${pct}%</div><div><b>${mark}</b></div><div class="sub">${score} из ${pool.length} правильно</div><br><div class="row" style="justify-content:center"><button class="btn" onclick="route()">Пройти заново</button>${isExam||custom?`<button class="btn ghost" onclick="go('')">На главную</button>`:`<button class="btn ghost" onclick="go('${t.id}-read')">Конспект</button>`}</div></div>`;
      return;
    }
    const q=pool[i]; answered=false;
    const src=(isExam||custom)&&q.tid?`<div class="sub" style="margin-bottom:4px">${esc(T(q.tid).title)}</div>`:"";
    app.innerHTML=header(title,back)+`
     <div class="progress-line"><span>Вопрос ${i+1} из ${pool.length}</span><span>✅ ${score}</span></div>
     <div class="bar" style="margin-bottom:10px"><i style="width:${i/pool.length*100}%"></i></div>
     ${src}<div class="q-title">${q.q}</div>
     <div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
     <div id="after"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(answered) return; answered=true;
      const chosen=q.opts[+b.dataset.k], ok=chosen===q.right;
      if(ok){ score++; markRight(q.tid,q.q); } else markWrong(q.tid,q.q);
      document.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(q.opts[+x.dataset.k]===q.right) x.classList.add("ok");});
      if(!ok) b.classList.add("no");
      $("#after").innerHTML=`<div class="expl">${ok?"✅ Верно! ":"❌ Неверно. "}${q.e||""}</div><button class="btn wide" id="nx">${i+1<pool.length?"Дальше →":"Результат"}</button>`;
      $("#nx").onclick=()=>{i++;draw();};
    });
  }
  draw();
}
function mistakesMode(){
  const qs=wrongList().map(w=>{const t=T(w.t); if(!t) return null; const q=t.quiz.find(x=>x.q===w.q); return q?{...q,tid:t.id}:null;}).filter(Boolean);
  if(!qs.length){
    app.innerHTML=header("🩹 Работа над ошибками","")+`<div class="card result"><div class="big">✨</div><div>Ошибок пока нет. Вопросы, на которые ответишь неправильно в тестах, появятся здесь — и уйдут, когда ответишь верно.</div><br><button class="btn" onclick="go('')">На главную</button></div>`;
    return;
  }
  quiz(null,null,pick(qs,20));
}

/* --- Словарь --- */
function dictMode(){
  const all=[];
  TOPICS.forEach(t=>{
    t.cards.forEach(([q,a])=>all.push({q:strip(q),a:strip(a),t}));
    t.pairs.forEach(([q,a])=>all.push({q:strip(q),a:strip(a),t}));
  });
  app.innerHTML=header("📚 Словарь терминов","")+`
   <input class="search" id="sq" placeholder="Поиск: например, остеон, нексус, Купфер…" autocomplete="off">
   <div class="chips" id="mods"><button class="chip on" data-m="">Все</button>${MODULES.filter(m=>modTopics(m.id).length).map(m=>`<button class="chip" data-m="${m.id}">${m.id}</button>`).join("")}</div>
   <div class="sub" id="cnt" style="margin-bottom:8px"></div><div id="list"></div>`;
  let mod="";
  const hl=(s,q)=>{ const e=esc(s); if(!q) return e; const i=e.toLowerCase().indexOf(esc(q).toLowerCase()); return i<0?e:e.slice(0,i)+"<mark>"+e.slice(i,i+esc(q).length)+"</mark>"+e.slice(i+esc(q).length); };
  function draw(){
    const q=$("#sq").value.trim().toLowerCase();
    const res=all.filter(x=>(!mod||x.t.mod===mod)&&(!q||x.q.toLowerCase().includes(q)||x.a.toLowerCase().includes(q)));
    $("#cnt").textContent=`Найдено: ${res.length}`;
    $("#list").innerHTML=res.slice(0,200).map(x=>`<div class="term"><b>${hl(x.q,q)}</b>${hl(x.a,q)}<div class="src">${esc(x.t.title)}</div></div>`).join("")+(res.length>200?`<div class="note">Показаны первые 200 — уточни поиск</div>`:"");
  }
  $("#sq").oninput=draw;
  document.querySelectorAll("#mods .chip").forEach(c=>c.onclick=()=>{mod=c.dataset.m;document.querySelectorAll("#mods .chip").forEach(x=>x.classList.toggle("on",x===c));draw();});
  draw(); $("#sq").focus();
}

/* --- Сортировка --- */
function sortMode(t){
  let ci=0;
  function start(){
    const cls=t.groups[ci], items=shuffle(itemsOf(cls)).slice(0,12), groups=Object.keys(cls.g);
    let i=0,score=0,streak=0,best=0,lock=false;
    function draw(){
      if(i>=items.length){
        const pct=Math.round(score/items.length*100); rec(t.id,"sort",pct);
        app.innerHTML=header("🗂️ Разложи по группам",t.id)+`<div class="card result"><div class="big">${pct}%</div><div>${score} из ${items.length} · лучшая серия ${best} 🔥</div><br><div class="row" style="justify-content:center"><button class="btn" onclick="sortMode(T('${t.id}'))">Ещё раз</button></div></div>`;
        return;
      }
      const it=items[i]; lock=false;
      app.innerHTML=header("🗂️ Разложи по группам",t.id)+
       `<div class="chips">${t.groups.map((c,k)=>`<button class="chip ${k===ci?"on":""}" data-c="${k}">${c.name}</button>`).join("")}</div>
       <div class="progress-line"><span>${i+1} / ${items.length}</span><span>✅ ${score} ${streak>1?`<span class="streak">· серия ${streak} 🔥</span>`:""}</span></div>
       <div class="drug">${esc(it.name)}</div>
       <div>${groups.map((g,k)=>`<button class="gbtn" data-g="${k}">${esc(g)}</button>`).join("")}</div>
       <div id="after"></div>`;
      document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ci=+c.dataset.c;start();});
      document.querySelectorAll(".gbtn").forEach(b=>b.onclick=()=>{
        if(lock) return; lock=true;
        const g=groups[+b.dataset.g], ok=it.groups.includes(g);
        if(ok){score++;streak++;best=Math.max(best,streak);} else streak=0;
        document.querySelectorAll(".gbtn").forEach(x=>{ if(it.groups.includes(groups[+x.dataset.g])) x.classList.add("ok"); });
        if(!ok) b.classList.add("no");
        if(ok){ setTimeout(()=>{i++;draw();},550); }
        else { $("#after").innerHTML=`<button class="btn wide" id="nx">Понял, дальше →</button>`; $("#nx").onclick=()=>{i++;draw();}; }
      });
    }
    draw();
  }
  start();
}

/* --- Пары --- */
function pairsMode(t){
  const set=pick(t.pairs,6);
  const L=shuffle(set.map((p,i)=>({i,txt:p[0]}))), R=shuffle(set.map((p,i)=>({i,txt:p[1]})));
  let sel=null,done=0,mistakes=0;
  app.innerHTML=header("🔗 Найди пару",t.id)+`
   <div class="progress-line"><span>Соедини термин с фактом</span><span id="st">ошибок: 0</span></div>
   <div class="pairs" id="pg">${L.map((l,k)=>`<button class="pc" data-s="L" data-i="${l.i}" style="grid-column:1;grid-row:${k+1}">${esc(l.txt)}</button>`).join("")}${R.map((r,k)=>`<button class="pc" data-s="R" data-i="${r.i}" style="grid-column:2;grid-row:${k+1};font-weight:500">${esc(r.txt)}</button>`).join("")}</div>
   <div id="after" style="margin-top:12px"></div>`;
  document.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("done")) return;
    if(!sel || sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove("sel"); sel=b; b.classList.add("sel"); return; }
    if(sel.dataset.i===b.dataset.i){
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); sel=null; done++;
      if(done===set.length){
        const pct=Math.max(0,Math.round(100-mistakes*100/ (set.length*2)));
        rec(t.id,"pairs",pct);
        $("#after").innerHTML=`<div class="card result"><div class="big">${pct}%</div><div>Все пары найдены! Ошибок: ${mistakes}</div><br><button class="btn" onclick="pairsMode(T('${t.id}'))">Новый набор</button></div>`;
      }
    } else {
      mistakes++; $("#st").textContent="ошибок: "+mistakes;
      const a=sel; a.classList.add("err"); b.classList.add("err");
      setTimeout(()=>{a.classList.remove("err","sel");b.classList.remove("err");},450); sel=null;
    }
  });
}

/* --- Верно/неверно --- */
function tfMode(t){
  const items=pick(t.tf,10); let i=0,score=0;
  function draw(){
    if(i>=items.length){
      const pct=Math.round(score/items.length*100); rec(t.id,"tf",pct);
      app.innerHTML=header("⚡ Верно / неверно",t.id)+`<div class="card result"><div class="big">${pct}%</div><div>${score} из ${items.length}</div><br><button class="btn" onclick="tfMode(T('${t.id}'))">Ещё раунд</button></div>`;
      return;
    }
    const [s,v,e]=items[i];
    app.innerHTML=header("⚡ Верно / неверно",t.id)+`
     <div class="progress-line"><span>${i+1} / ${items.length}</span><span>✅ ${score}</span></div>
     <div class="drug" style="font-size:19px">${esc(s)}</div>
     <div class="tf" id="tfb"><button class="btn f" data-v="0">✗ Неверно</button><button class="btn" data-v="1">✓ Верно</button></div>
     <div id="after" style="margin-top:12px"></div>`;
    let lock=false;
    document.querySelectorAll("#tfb .btn").forEach(b=>b.onclick=()=>{
      if(lock) return; lock=true;
      const ok=(b.dataset.v==="1")===v; if(ok) score++;
      $("#after").innerHTML=`<div class="expl">${ok?"✅ Правильно! ":"❌ Нет. "}${v?"Это верно. ":"Это неверно. "}${e}</div><button class="btn wide" id="nx">Дальше →</button>`;
      $("#nx").onclick=()=>{i++;draw();};
    });
  }
  draw();
}

initFirebase();
route();
</script>
